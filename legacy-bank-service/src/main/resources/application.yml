server:
  port: 8443
  ssl:
    enabled: true
    key-store: ${BANK_KEY_STORE:file:/run/bank-tls/tls.p12}
    key-store-password: ${BANK_KEY_STORE_PASSWORD:}
    key-store-type: PKCS12
    key-alias: legacy-bank-service

spring:
  config:
    import: optional:configtree:${BANK_SECRETS_DIR:/run/secrets/bank/}
  datasource:
    url: ${BANK_DB_URL:jdbc:postgresql://localhost:5432/omp?currentSchema=bank_ledger}
    username: ${BANK_DB_USER:bank_ledger_svc}
    password: ${BANK_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 2000
      data-source-properties:
        options: "-c statement_timeout=3000 -c lock_timeout=2000"
  flyway:
    schemas: bank_ledger
    default-schema: bank_ledger
  http:
    converters:
      preferred-json-mapper: jackson2
  application:
    name: legacy-bank-service

bank:
  security:
    username: ${BANK_WS_USERNAME:platform-user}
    password: ${BANK_PASSWORD:}

logging:
  level:
    org.springframework.ws: INFO
    com.example.omp.bank: INFO

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

management.tracing.sampling.probability: ${TRACING_SAMPLE_RATE:1.0}
management.tracing.propagation.type: w3c
management.tracing.export.otlp.enabled: ${TRACING_EXPORT_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://otel-collector:4318/v1/traces}
management.logging.export.otlp.enabled: false

# Export the real bounded HTTP histogram used by latency SLOs and trace exemplars.
management.metrics.distribution.percentiles-histogram.http.server.requests: true
management.metrics.distribution.slo.http.server.requests: 1s,2500ms
