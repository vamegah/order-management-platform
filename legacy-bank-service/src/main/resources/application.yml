server:
  port: 8443
  ssl:
    enabled: true
    key-store: classpath:keystore.p12
    key-store-password: changeit
    key-store-type: PKCS12
    key-alias: legacy-bank

spring:
  http:
    converters:
      preferred-json-mapper: jackson2
  application:
    name: legacy-bank-service

bank:
  security:
    username: platform-user
    password: ${BANK_PASSWORD:platform-secret}

logging:
  level:
    org.springframework.ws: INFO
    com.example.omp.bank: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
