server:
  port: 8085

spring:
  config:
    import: optional:configtree:${BANK_SECRETS_DIR:/run/secrets/bank/}
  datasource:
    url: ${BANK_ADAPTER_DB_URL:jdbc:postgresql://localhost:5432/omp?currentSchema=bank_adapter}
    username: ${BANK_ADAPTER_DB_USER:bank_adapter_svc}
    password: ${BANK_ADAPTER_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 2000
      data-source-properties:
        options: "-c statement_timeout=3000 -c lock_timeout=2000"
  flyway:
    schemas: bank_adapter
    default-schema: bank_adapter
  http:
    converters:
      preferred-json-mapper: jackson2
  application:
    name: legacy-banking-adapter
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://keycloak.localhost/realms/omp}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://keycloak:8080/realms/omp/protocol/openid-connect/certs}

bank:
  ws:
    url: ${BANK_WS_URL:https://localhost:8443/ws}
    username: ${BANK_WS_USERNAME:platform-user}
    password: ${BANK_PASSWORD:}
    trust-store: ${BANK_TRUST_STORE:}
    trust-store-password: ${BANK_TRUST_STORE_PASSWORD:}

resilience4j:
  circuitbreaker:
    instances:
      banking:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true

management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        banking.soap.duration: true
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,circuitbreakers

logging:
  level:
    com.example.omp.adapter: INFO
    org.springframework.ws: INFO

springdoc:
  api-docs:
    version: OPENAPI_3_1
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: false

# Export the real bounded HTTP histogram used by latency SLOs and trace exemplars.
management.metrics.distribution.percentiles-histogram.http.server.requests: true
management.metrics.distribution.slo.http.server.requests: 1s,2500ms
