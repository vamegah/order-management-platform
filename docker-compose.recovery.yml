# Explicit development opt-in. Run the token projector as the application UID
# before starting this overlay; mount the directory so atomic rotation is visible.
services:
  order-service:
    environment:
      OMP_ORDER_RECOVERY_ENABLED: "true"
      OMP_ORDER_LIFECYCLE_ENABLED: "true"
      OMP_ORDER_RECOVERY_TOKEN_FILE: /run/order-recovery/access.jwt
    volumes:
      - type: bind
        source: ${ORDER_RECOVERY_TOKEN_DIRECTORY:?Run the token projector and set ORDER_RECOVERY_TOKEN_DIRECTORY}
        target: /run/order-recovery
        read_only: true
        bind:
          create_host_path: false
  inventory-service:
    environment:
      OMP_INVENTORY_EXPIRY_ENABLED: "true"
      OMP_INVENTORY_EXPIRY_TTL: PT30M
