# Supervised lifecycle deployment; combine with the existing private token projector overlay.
services:
  order-service:
    environment:
      OMP_ORDER_LIFECYCLE_ENABLED: "true"
      OMP_ORDER_RECOVERY_TOKEN_FILE: /run/order-recovery/access.jwt
    volumes:
      - type: bind
        source: ${ORDER_RECOVERY_TOKEN_DIRECTORY:?Provision the private recovery identity directory}
        target: /run/order-recovery
        read_only: true
        bind:
          create_host_path: false
  inventory-service:
    environment:
      OMP_INVENTORY_EXPIRY_ENABLED: "true"
      OMP_INVENTORY_EXPIRY_TTL: PT30M
