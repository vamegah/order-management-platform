# ==============================================================================
# Local development overrides
# ==============================================================================
# Active when SPRING_PROFILES_ACTIVE=local (the default).
# Runs on a developer laptop or in the local Docker stack.
# ==============================================================================

logging:
  level:
    com.example.omp: DEBUG
    org.springframework.security: DEBUG
    org.flywaydb: INFO
    # Verbose SQL logging — the exact statements Hibernate sends to Postgres.
    org.springframework.graphql: DEBUG
    graphql.execution: DEBUG

spring:
  # No JPA in the gateway.

management:
  endpoint:
    health:
      show-details: always

spring.graphql:
  graphiql:
    enabled: true