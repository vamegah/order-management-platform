query AggregateOrders($first: ID!, $second: ID!) { first: order(id: $first) { id customer { id email } lines { id product { id sku } quantity unitPrice { amount currency } lineTotal } } second: order(id: $second) { id customer { id email } lines { id product { id sku } quantity unitPrice { amount currency } lineTotal } } repeated: order(id: $first) { id customer { id email } lines { id product { id sku } } } }
