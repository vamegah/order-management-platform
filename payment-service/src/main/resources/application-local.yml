# ==============================================================================
# Local development overrides
# ==============================================================================
# Same pattern as Phase 1 services.
# ==============================================================================

logging:
  level:
    com.example.omp.inventory: DEBUG
    net.devh.boot.grpc.server: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoint:
    health:
      show-details: always

grpc:
  server:
    enable-reflection: true