name: ${COMPOSE_PROJECT_NAME:?An isolated operations project is required}
services:
  alert-receiver:
    image: python:3.12-alpine@sha256:c5ba3deef00c7758561a0f03c26f44f10589263d40e732b8748e0d1f38f6dd89
    command:
    - python
    - /app/alert_receiver.py
    environment:
      OMP_ACCEPTANCE_FIXTURES: 'true'
    volumes:
    - ./scripts/operations/alert_receiver.py:/app/alert_receiver.py:ro
    ports:
    - 127.0.0.1::8080
    networks:
    - ops
    mem_limit: 128m
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
  alertmanager:
    image: prom/alertmanager:v0.35.1@sha256:4e3d029e69c7f61dd53a2b31a3dc427a2b81736cffca185c0854075e07969e36
    command:
    - --config.file=/etc/alertmanager/alertmanager.yml
    - --storage.path=/alertmanager
    - --web.listen-address=:9093
    volumes:
    - ./infrastructure/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
    - 127.0.0.1::9093
    networks:
    - ops
    mem_limit: 128m
  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=1h
    - --enable-feature=exemplar-storage
    volumes:
    - ./infrastructure/prometheus/operations-acceptance.yml:/etc/prometheus/prometheus.yml:ro
    - ./infrastructure/prometheus/rules:/etc/prometheus/rules:ro
    ports:
    - 127.0.0.1::9090
    networks:
    - ops
    mem_limit: 256m
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.166.0@sha256:3e18fe04181de50bdd72e23ad4a4d6214b54351e63d496f1c58127cc4541ad7f
    command:
    - --config=/etc/otelcol/config.yml
    volumes:
    - ./infrastructure/otel/otel-collector.yml:/etc/otelcol/config.yml:ro
    ports:
    - 127.0.0.1::4318
    - 127.0.0.1::8888
    networks:
    - ops
    mem_limit: 512m
  tempo:
    image: grafana/tempo:3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
    command:
    - -config.file=/etc/tempo.yml
    volumes:
    - ./infrastructure/tempo/operations-acceptance.yml:/etc/tempo.yml:ro
    ports:
    - 127.0.0.1::3200
    networks:
    - ops
    mem_limit: 256m
networks:
  ops:
    internal: false
    labels:
      com.omp.task: section7
