      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/omp
      SPRING_DATASOURCE_USERNAME: payments_svc
      SPRING_DATASOURCE_PASSWORD_FILE: /run/secrets/payments_svc_password

      OIDC_ISSUER_URI: https://auth.${OMP_DOMAIN}/realms/omp
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/omp/protocol/openid-connect/certs

      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      PROMETHEUS_ENV: prod

      GRPC_REFLECTION_ENABLED: "false"
    secrets:
      - payments_svc_password
    deploy:
      # Stream subscriptions are local to this process; overlapping replicas lose events.
      replicas: 1
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 0
      update_config:
        parallelism: 1
        order: stop-first
        delay: 10s
      rollback_config:
        parallelism: 1
        order: stop-first

    volumes:
      - /etc/omp/tls/payment-service/tls.crt:/etc/tls/tls.crt:ro
      - /etc/omp/tls/payment-service/tls.key:/etc/tls/tls.key:ro
      - /etc/omp/tls/ca/ca.crt:/etc/tls/ca.crt:ro

  notification-service:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092,kafka-2:9092,kafka-3:9092
      OIDC_ISSUER_URI: https://auth.${OMP_DOMAIN}/realms/omp
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/omp/protocol/openid-connect/certs
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      PROMETHEUS_ENV: prod
    secrets:
      - redis_password
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 0
      update_config:
        parallelism: 1
        order: start-first
        delay: 10s
    labels:
      - traefik.enable=true
      - traefik.http.routers.notification-service.rule=Host(`notification.${OMP_DOMAIN}`)
      - traefik.http.routers.notification-service.entrypoints=websecure
      - traefik.http.routers.notification-service.tls.certresolver=le
      - traefik.http.services.notification-service.loadbalancer.server.port=8084
    stop_grace_period: 90s

  # ============================================================================
  # KEYCLOAK — production mode
  # ----------------------------------------------------------------------------
  # Changes vs dev:
  #   - start --optimized (no dev conveniences)
  #   - No realm import on boot (realms are applied via CI, not container boot)
  #   - Admin console on admin host only, not public host
  #   - Password from Docker secret
  #   - TLS terminated by Traefik (already)
  # ============================================================================
  keycloak:
    command:
      - start
      - --optimized
      - --http-port=8080
      - --http-enabled=true
      - --hostname=${OMP_DOMAIN}
      - --hostname-strict=true
      - --proxy-headers=xforwarded
      - --health-enabled=true
      - --metrics-enabled=true
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      # Remove KEYCLOAK_ADMIN_PASSWORD env — it must come from secret file
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=keycloak
      KC_DB_USERNAME: ${POSTGRES_SUPERUSER}
      KC_DB_PASSWORD_FILE: /run/secrets/postgres_superuser_password
      KC_DB_SCHEMA: keycloak
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_LOG_LEVEL: INFO
      KC_PROXY_HEADERS: xforwarded
    secrets:
      - keycloak_admin_password
      - postgres_superuser_password
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - traefik.enable=true
      # Public: token endpoint only
      - traefik.http.routers.keycloak.rule=Host(`auth.${OMP_DOMAIN}`)
      - traefik.http.routers.keycloak.entrypoints=websecure
      - traefik.http.routers.keycloak.tls.certresolver=le
      - traefik.http.services.keycloak.loadbalancer.server.port=8080
      # Admin console: separate host, extra auth layer
      - traefik.http.routers.keycloak-admin.rule=Host(`keycloak-admin.${OMP_DOMAIN}`)
      - traefik.http.routers.keycloak-admin.entrypoints=websecure
      - traefik.http.routers.keycloak-admin.tls.certresolver=le
      - traefik.http.routers.keycloak-admin.middlewares=admin-auth
  # ============================================================================
  # PROMTAIL — log shipper (prod tuning)
  # ----------------------------------------------------------------------------
  # Identical to dev, with production resource limits and the DEBUG-log-drop
  # rule enabled.
  #
  # The only config difference is a note in promtail-config.yml about
  # enabling the drop-DEBUG stage. For prod, we could mount a separate
  # promtail.prod.yml, but for a single difference, we handle it via a
  # comment in the shared config and skip the mount.
  #
  # (If more prod/dev differences accumulate, split into two config files
  # like we did for Traefik and Postgres.)
  # ============================================================================
  promtail:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  # ============================================================================
  # OBSERVABILITY — resource limits + log rotation
  # ----------------------------------------------------------------------------
  # All observability services remain, but get resource caps and log rotation.
  # Prometheus and Grafana get the largest budgets (they index a lot).
  # ============================================================================
  prometheus:
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - traefik.enable=true
      - traefik.http.routers.prometheus.rule=Host(`prometheus.${OMP_DOMAIN}`)
      - traefik.http.routers.prometheus.entrypoints=websecure
      - traefik.http.routers.prometheus.tls.certresolver=le
      - traefik.http.routers.prometheus.middlewares=admin-auth
      - traefik.http.services.prometheus.loadbalancer.server.port=9090

  grafana:
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SERVER_ROOT_URL: https://grafana.${OMP_DOMAIN}
      GF_AUTH_PROXY_ENABLED: "false"
    secrets:
      - grafana_admin_password
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`grafana.${OMP_DOMAIN}`)
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.tls.certresolver=le
      - traefik.http.services.grafana.loadbalancer.server.port=3000

  loki:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  tempo:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  otel-collector:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# ==============================================================================
# NOTE ON OVERLAY LIMITATIONS
# ------------------------------------------------------------------------------
# Requires Compose 2.24.4+ for !override. Maps merge by key; ordinary
# sequences merge, and ports/volumes use their documented uniqueness keys.
# An empty ordinary list does not remove inherited ports. !override explicitly
# replaces ingress ports and clears the database/cache/broker host bindings.
# command and entrypoint replace the base values. Volume entries with the same
# container target replace that target; other base mounts remain inherited.
# Inspect the resolved configuration before any production deployment.
# ==============================================================================
