# Standalone production deployment; add the verified immutable image overlay.
name: ${COMPOSE_PROJECT_NAME:-omp}
networks:
  edge: {}
  egress: {}
  app:
    internal: true
  ops:
    internal: true
  data:
    internal: true
volumes:
  traefik-data: {}
  redis_secure_data: {}
  redis_replica_1_secure_data: {}
  redis_replica_2_secure_data: {}
  quota_redis_secure_data: {}
  postgres-data: {}
  keycloak-data: {}
  kafka-data: {}
  kafka-2-data: {}
  kafka-3-data: {}
  alertmanager-data: {}
  prometheus-data: {}
  grafana-data: {}
  loki-data: {}
  tempo-data: {}
  alloy-data: {}
secrets:
  quota_redis_password:
    file: ${OMP_SECRETS_DIRECTORY:-/etc/omp/secrets}/quota_redis_password
  redis_notifications_password:
    file: ${OMP_SECRETS_DIRECTORY:-/etc/omp/secrets}/redis_notifications_password
  inventory_svc_password:
    file: ${OMP_SECRETS_DIRECTORY:-/etc/omp/secrets}/inventory_svc_password
  grafana_admin_password:
    file: ${OMP_SECRETS_DIRECTORY:-/etc/omp/secrets}/grafana_admin_password
  payment-service_kafka_jaas:
    file: ${OMP_SECRETS_DIRECTORY:-/etc/omp/secrets}/payment-service_kafka_jaas
  customers_svc_password:
    file: ${OMP_SECRETS_DIRECTORY:-/etc/omp/secrets}/customers_svc_password
  products_svc_password:
    file: ${OMP_SECRETS_DIRECTORY:-/etc/omp/secrets}/products_svc_password
  keycloak_admin_password:
    file: ${OMP_SECRETS_DIRECTORY:-/etc/omp/secrets}/keycloak_admin_password
  notifications_svc_password:
    file: ${OMP_SECRETS_DIRECTORY:-/etc/omp/secrets}/notifications_svc_password
  keycloak_db_password:
    file: ${OMP_SECRETS_DIRECTORY:-/etc/omp/secrets}/keycloak_db_password
  inventory-service_kafka_jaas:
    file: ${OMP_SECRETS_DIRECTORY:-/etc/omp/secrets}/inventory-service_kafka_jaas
  pgbackrest_repo_cipher:
    file: ${OMP_SECRETS_DIRECTORY:-/etc/omp/secrets}/pgbackrest_repo_cipher
  kafka_broker_password:
    file: ${OMP_SECRETS_DIRECTORY:-/etc/omp/secrets}/kafka_broker_password
  ingress_admin_users:
    file: ${OMP_SECRETS_DIRECTORY:-/etc/omp/secrets}/ingress_admin_users
  redis_monitor_password:
    file: ${OMP_SECRETS_DIRECTORY:-/etc/omp/secrets}/redis_monitor_password
  stripe_webhook_secret:
    file: ${OMP_SECRETS_DIRECTORY:-/etc/omp/secrets}/stripe_webhook_secret
  postgres_exporter_password:
    file: ${OMP_SECRETS_DIRECTORY:-/etc/omp/secrets}/postgres_exporter_password
  redis_sentinel_password:
    file: ${OMP_SECRETS_DIRECTORY:-/etc/omp/secrets}/redis_sentinel_password
  payments_svc_password:
    file: ${OMP_SECRETS_DIRECTORY:-/etc/omp/secrets}/payments_svc_password
  kafka_monitor_password:
    file: ${OMP_SECRETS_DIRECTORY:-/etc/omp/secrets}/kafka_monitor_password
  orders_svc_password:
    file: ${OMP_SECRETS_DIRECTORY:-/etc/omp/secrets}/orders_svc_password
  postgres_superuser_password:
    file: ${OMP_SECRETS_DIRECTORY:-/etc/omp/secrets}/postgres_superuser_password
  notification-service_kafka_jaas:
    file: ${OMP_SECRETS_DIRECTORY:-/etc/omp/secrets}/notification-service_kafka_jaas
  redis_password:
    file: ${OMP_SECRETS_DIRECTORY:-/etc/omp/secrets}/redis_password
  order-service_kafka_jaas:
    file: ${OMP_SECRETS_DIRECTORY:-/etc/omp/secrets}/order-service_kafka_jaas
  kafka_admin_properties:
    file: ${OMP_SECRETS_DIRECTORY:-/etc/omp/secrets}/kafka_admin_properties
  stripe_api_key:
    file: ${OMP_SECRETS_DIRECTORY:-/etc/omp/secrets}/stripe_api_key
  kafka_scram_bootstrap:
    file: ${OMP_SECRETS_DIRECTORY:-/etc/omp/secrets}/kafka_scram_bootstrap
  kafka_cluster_id:
    file: ${OMP_SECRETS_DIRECTORY:-/etc/omp/secrets}/kafka_cluster_id
  redis_exporter_passwords:
    file: ${OMP_SECRETS_DIRECTORY:-/etc/omp/secrets}/redis_exporter_passwords
  alert_receiver_token:
    file: ${OMP_SECRETS_DIRECTORY:-/etc/omp/secrets}/alert_receiver_token
  bank_ledger_svc_password:
    file: ${OMP_SECRETS_DIRECTORY:-/etc/omp/secrets}/bank_ledger_svc_password
  bank_adapter_svc_password:
    file: ${OMP_SECRETS_DIRECTORY:-/etc/omp/secrets}/bank_adapter_svc_password
services:
  product-service:
    restart: unless-stopped
    user: 1000:2000
    environment: !override
      SPRING_PROFILES_ACTIVE: prod
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: 'true'
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=55 -XX:+ExitOnOutOfMemoryError
      OIDC_ISSUER_URI: https://auth.${OMP_DOMAIN:?Set domain}/realms/omp
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/omp/protocol/openid-connect/certs
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_TRANSPORT: http
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      TRACING_SAMPLE_RATE: '1.0'
      TRACING_EXPORT_ENABLED: 'true'
      PROMETHEUS_ENV: prod
      API_QUOTAS_ENABLED: 'true'
      QUOTA_REDIS_HOST: quota-redis
      QUOTA_REDIS_USERNAME: quota
      QUOTA_REDIS_PASSWORD_FILE: /run/secrets/quota_redis_password
      SPRING_CONFIG_IMPORT: configtree:/run/omp/
      PRODUCT_SERVICE_URL: http://product-service:8081
      CUSTOMER_SERVICE_URL: http://customer-service:8082
      ORDER_SERVICE_URL: http://order-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8080
      APP_CORS_ALLOWED_ORIGINS: https://web.${OMP_DOMAIN},https://admin.${OMP_DOMAIN}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/omp?currentSchema=products,public
      SPRING_DATASOURCE_USERNAME: products_svc
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: '8'
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES: omp-api
    networks: !override
    - app
    - data
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    mem_limit: 512m
    cpus: '1.0'
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
        labels: com.docker.compose.service,com.docker.compose.project
    secrets: !override
    - source: quota_redis_password
      target: quota_redis_password
    - source: products_svc_password
      target: /run/omp/spring.datasource.password
    depends_on:
      keycloak:
        condition: service_healthy
      quota-redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      replicas: 1
      update_config:
        order: stop-first
        parallelism: 1
      rollback_config:
        order: stop-first
        parallelism: 1
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O-
      - http://localhost:8081/actuator/health/readiness
      interval: 15s
      timeout: 4s
      retries: 10
      start_period: 120s
