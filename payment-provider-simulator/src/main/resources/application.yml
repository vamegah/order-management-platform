# ==============================================================================
# Payment Provider Simulator — configuration
# ==============================================================================
# A stateless HTTP service that simulates an external payment provider for
# local development and end-to-end testing.
# ==============================================================================

spring:
  http:
    converters:
      preferred-json-mapper: jackson2
  application:
    name: payment-provider-simulator
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

# ==============================================================================
# Server
# ==============================================================================
server:
  port: ${SERVER_PORT:8090}
  shutdown: graceful

# ==============================================================================
# Management (actuator) on separate port
# ==============================================================================
management:
  server:
    port: ${MANAGEMENT_PORT:8091}
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      env: ${PROMETHEUS_ENV:dev}

# ==============================================================================
# Simulator configuration
# ==============================================================================
omp:
  simulator:
    # The URL where webhooks are POSTed. In dev, this points at
    # payment-service's webhook endpoint. In a real deployment, this
    # would be provided by the external provider's dashboard.
    webhook-url: ${WEBHOOK_URL:http://payment-service:9093/webhooks/payment}

    # The HMAC secret used to sign outgoing webhooks. MUST match the
    # secret configured in payment-service (see payment-service's
    # omp.webhooks.inbound.payment.secrets.current).
    #
    # In dev: a fixed, public secret (it's a simulator, not a real provider).
    # In prod: this service is not deployed at all — the real provider
    # signs webhooks with a secret only they and payment-service know.
    hmac-secret: ${WEBHOOK_HMAC_SECRET:dev-simulator-secret-not-for-production}

    # How long to wait before sending the webhook after a "payment" is
    # initiated. Simulates the round-trip time to a real provider.
    # In dev, this is short (2 seconds) so tests run quickly.
    webhook-delay-ms: ${WEBHOOK_DELAY_MS:2000}

    # Simulate failures? 0.0 = never fail, 1.0 = always fail.
    # Used in tests to verify payment-service's handling of failed payments.
    failure-rate: ${FAILURE_RATE:0.0}

# ==============================================================================
# Logging
# ==============================================================================
logging:
  level:
    root: INFO
    com.example.omp.provider: DEBUG
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"
# Match the patched Swagger UI webjar selected by the reactor.
springdoc.swagger-ui.version: 5.34.1
