# ==============================================================================
# Test profile configuration
# ==============================================================================
# Used by @SpringBootTest and friends. Overrides the base config for tests.
#
# Notes:
#   - Kafka is provided by spring-kafka-test's @EmbeddedKafka.
#   - PostgreSQL and Redis use Spring-owned Testcontainers.
#   - Tracing is disabled.
# ==============================================================================

spring:
  application:
    name: notification-service

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: notifications
  flyway:
    enabled: true
    schemas: notifications
    default-schema: notifications

  kafka:
    consumer:
      group-id: notification-service-test
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  data:
    redis:
      host: localhost
      port: 6379   # overridden by test config if using a test container

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://mock-issuer/realms/omp

management:
  server:
    port: 0
  tracing:
    enabled: false

webhook:
  kafka:
    replication-factor: 1
    delivery-concurrency: 1
    event-concurrency: 1
    dlq-concurrency: 1
  topics:
    events:
      order: orders.events.order
      payment: payments.events.payment
      inventory: inventory.events.reservation

logging:
  level:
    root: WARN
    com.example.omp: INFO
    org.springframework.kafka: WARN
    org.springframework: WARN
    com.omp.notification.webhook: DEBUG
    org.apache.kafka: WARN

omp:
  notifications:
    allowed-origins:
      - "http://localhost"
