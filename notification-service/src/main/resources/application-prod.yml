# ==============================================================================
# Production overrides
# ==============================================================================

logging:
  level:
    root: WARN
    com.example.omp: INFO
    org.springframework.web.socket: WARN
    org.springframework.messaging: WARN

spring:
  kafka:
    consumer:
      # In prod, start from earliest if the group has no offsets (fresh group).
      # This ensures no events are missed when a consumer group is re-created.
      auto-offset-reset: earliest

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}
  endpoint:
    health:
      show-details: when-authorized

omp:
  notifications:
    # In prod, restrict to the deployed web origins.
    allowed-origins:
      - "https://web.${OMP_DOMAIN}"
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
