# Tail sampling requires trace affinity: one collector per supported Compose environment.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 4
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 96
  attributes/redact:
    actions:
    - key: http.request.header.authorization
      action: delete
    - key: http.request.header.cookie
      action: delete
    - key: http.response.header.set_cookie
      action: delete
    - key: db.statement
      action: delete
    - key: url.query
      action: delete
    - key: url.full
      action: delete
    - key: url.path
      action: delete
    - key: http.target
      action: delete
    - key: db.query.text
      action: delete
    - key: http.url
      action: delete
    - key: user.email
      action: delete
    - key: user.name
      action: delete
    - key: enduser.id
      action: delete
    - key: messaging.message.body
      action: delete
    - key: graphql.document
      action: delete
    - key: graphql.variables
      action: delete
    - key: db.query.parameters
      action: delete
  transform/privacy:
    error_mode: propagate
    trace_statements:
    - context: span
      statements:
      - set(status.message, "")
      - delete_key(attributes, "error.message")
      - delete_key(attributes, "http.request.body")
      - delete_key(attributes, "http.response.body")
    - context: spanevent
      statements:
      - delete_key(attributes, "exception.message")
      - delete_key(attributes, "exception.stacktrace")
  tail_sampling:
    decision_wait: 15s
    num_traces: 5000
    expected_new_traces_per_sec: 200
    policies:
    - name: errors
      type: status_code
      status_code:
        status_codes:
        - ERROR
    - name: slow
      type: latency
      latency:
        threshold_ms: 1000
    - name: baseline
      type: probabilistic
      probabilistic:
        sampling_percentage: 10
  batch:
    send_batch_size: 512
    send_batch_max_size: 1024
    timeout: 1s
exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    timeout: 3s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 15s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 128
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: /health/status
service:
  extensions:
  - health_check
  telemetry:
    logs:
      level: warn
    metrics:
      readers:
      - pull:
          exporter:
            prometheus:
              host: 0.0.0.0
              port: 8888
  pipelines:
    traces:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - attributes/redact
      - transform/privacy
      - tail_sampling
      - batch
      exporters:
      - otlp/tempo
