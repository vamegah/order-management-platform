# ==============================================================================
# Order Management Platform — Promtail configuration
# ------------------------------------------------------------------------------
# FILENAME : infrastructure/promtail/promtail-config.yml
# MOUNTED  : /etc/promtail/config.yml (read-only) into the promtail container
# USED BY  : docker-compose.yml (promtail service)
#            via: command: ["-config.file=/etc/promtail/config.yml"]
#
# WHAT PROMTAIL DOES
#   Promtail is Loki's official log shipper. It:
#     1. Discovers Docker containers (via the Docker socket).
#     2. Tails their log files on disk.
#     3. Parses the Docker json-file wrapper to extract the actual message.
#     4. Optionally parses the message as JSON if the application emits
#        structured logs.
#     5. Attaches labels (low cardinality) and structured metadata (high
#        cardinality, but per-line).
#     6. Pushes batches to Loki with retries.
#
#   Together with loki-config.yml (File 18), this completes the log pipeline:
#
#     Container stdout
#          │
#          ▼
#     Docker json-file on host (/var/lib/docker/containers/*/*-json.log)
#          │
#          ▼
#     Promtail (this config)
#          │
#          ▼
#     Loki (File 18's config)
#          │
#          ▼
#     Grafana (File 16's datasource)
#
# THE CRITICAL RULE: LOW CARDINALITY
#   Loki's performance depends entirely on the cardinality of its labels.
#   Every unique label combination = one stream. Too many streams, and the
#   ingester's memory explodes.
#
#   GUIDELINE: a label's value set should be bounded and small (dozens, not
#   thousands). Examples of GOOD labels: container name, service name,
#   severity level. Examples of BAD labels: trace_id, user_id, request_id,
#   IP address, HTTP path.
#
#   High-cardinality values go into STRUCTURED METADATA (Loki 3.0+), which
#   is queryable but does not create streams.
#
# LABELS WE ATTACH
#   container       — Docker container name (e.g., omp-postgres-1)
#   compose_service — Compose service name (e.g., postgres)
#   compose_project — Compose project name (e.g., omp)
#   stream          — stdout or stderr
#   tier            — data, edge, or app (matches Prometheus label)
#   level           — log level from JSON (DEBUG, INFO, WARN, ERROR, FATAL)
#
# STRUCTURED METADATA (not labels)
#   trace_id        — for Loki → Tempo cross-linking (see File 16)
#   span_id         — for span-level correlation
#
# REFERENCES
#   https://grafana.com/docs/loki/latest/send-data/promtail/configuration/
#   https://grafana.com/docs/loki/latest/send-data/promtail/stages/
#
# ==============================================================================

# ==============================================================================
# SERVER
# ==============================================================================
# Promtail exposes its own metrics and health endpoints on this port.
# Prometheus scrapes these (Phase 7 will add a scrape job; not in Phase 0).
# ==============================================================================
server:
  http_listen_port: 9080
  grpc_listen_port: 0     # disabled (not needed)
  log_level: info

# ==============================================================================
# POSITIONS
# ==============================================================================
# Where Promtail tracks how far it has read into each log file. On restart,
# it resumes from these positions rather than re-reading everything.
#
# CRITICAL: this file must persist across restarts. If it's lost (e.g., the
# volume is wiped), Promtail re-reads all logs from the beginning, pushing
# potentially gigabytes into Loki. This is why we mount a named volume for
# it (see File 2a-amend-2).
# ==============================================================================
positions:
  filename: /var/lib/promtail/positions.yaml
  sync_period: 10s

# ==============================================================================
# CLIENTS
# ==============================================================================
# Where to push log batches. One client: Loki's HTTP push API.
#
# BATCHING
#   Promtail accumulates log lines until either:
#     - `batchsize` bytes have accumulated, OR
#     - `batchwait` duration has elapsed.
#   Then it pushes a single HTTP request.
#
#   Trade-off:
#     - Larger batch size → fewer HTTP requests, more memory, higher latency.
#     - Smaller batch size → more requests, lower latency.
#
#   1 MB / 1 second is a good default.
#
# RETRIES
#   If Loki rejects a batch (network error, Loki down, rate limited),
#   Promtail retries with exponential backoff:
#     min_period: 500ms
#     max_period: 5m
#     max_retries: 10
#
#   With these settings, Promtail tolerates ~30 minutes of Loki downtime
#   before dropping logs. After max_retries, logs are lost (with a metric
#   increment: promtail_dropped_entries_total).
# ==============================================================================
clients:
  - url: http://loki:3100/loki/api/v1/push

    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10

    batchwait: 1s
    batchsize: 1048576   # 1 MB

    # Timeout for a single push request. 10s is generous.
    timeout: 10s

    # External labels — attached to every log line this client sends.
    # Equivalent to Prometheus's `external_labels`. Useful for distinguishing
    # data sources when Loki receives from multiple Promtails.
    #
    # In our setup, all logs come from one Promtail, so these are optional.
    # They're set for consistency with Prometheus.
    external_labels:
      source: promtail

# ==============================================================================
# SCRAPE CONFIGS
# ==============================================================================
# Each entry defines a job: how to discover log sources, how to parse them,
# and how to label the results.
#
# We have ONE scrape config that discovers all Docker containers via the
# Docker socket. Alternative: static config listing file paths (rejected —
# not scalable).
# ==============================================================================
scrape_configs:

  # ----------------------------------------------------------------------------
  # Docker containers (dynamic discovery)
  # ----------------------------------------------------------------------------
  - job_name: docker
    docker_sd_configs:
      # Connect to Docker via the mounted socket. Promtail queries the
      # Docker API to enumerate running containers.
      #
      # The socket is mounted read-only in File 2a-amend-2. Promtail only
      # needs read access — it doesn't create or modify containers.
      - host: unix:///var/run/docker.sock

        # How often to refresh the list of containers. 30s means a new
        # container starts producing logs in Loki within ~30s of appearing.
        refresh_interval: 30s

    # --------------------------------------------------------------------------
    # Relabeling — turn Docker metadata into Loki labels
    # --------------------------------------------------------------------------
    # This is where we decide WHICH Docker attributes become Loki labels.
    # Every label here becomes part of the stream key — keep it minimal.
    #
    # The __meta_docker_* labels are provided by Promtail's Docker service
    # discovery. We select a few, rename them to cleaner names, and drop
    # the rest.
    # --------------------------------------------------------------------------
    relabel_configs:

      # ------------------------------------------------------------------------
      # Filter: only containers in the `omp` Compose project
      # ------------------------------------------------------------------------
      # Without this, Promtail would ship logs from EVERY container on the
      # host (other projects, system containers, etc.). We want only ours.
      #
      # The `com.docker.compose.project` label is set by Docker Compose on
      # every container it manages.
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        regex: '^omp$'
        action: keep

      # ------------------------------------------------------------------------
      # Label: compose_service
      # ------------------------------------------------------------------------
      # The Compose service name (e.g., "postgres", "traefik", "loki").
      # Low cardinality — the number of services in the compose file.
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: compose_service

      # ------------------------------------------------------------------------
      # Label: compose_project
      # ------------------------------------------------------------------------
      # The Compose project name ("omp"). Constant in our setup, but useful
      # if we ever run multiple projects on one host.
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: compose_project

      # ------------------------------------------------------------------------
      # Label: container
      # ------------------------------------------------------------------------
      # The full container name (e.g., "omp-postgres-1"). More specific
      # than `compose_service` when a service has multiple replicas, which
      # we don't have in Phase 0 but may in Phase 1+.
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'   # Docker prepends "/"
        target_label: container

      # ------------------------------------------------------------------------
      # Label: tier
      # ------------------------------------------------------------------------
      # Service tier. Docker doesn't know about tiers, so we derive them
      # from the compose_service name via a regex mapping.
      #
      # This matches Prometheus's `tier` label (see File 15's scrape
      # configs), so queries like `{tier="data"}` work across both metrics
      # and logs.
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        regex: '^(postgres|redis|kafka|tempo|loki|otel-collector|pgbackrest)$'
        target_label: tier
        replacement: 'data'

      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        regex: '^(traefik|grafana|prometheus|pgadmin|kafka-ui|keycloak|promtail)$'
        target_label: tier
        replacement: 'edge'

      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        regex: '^(order-service|customer-service|product-service|inventory-service|payment-service|notification-service|api-gateway)$'
        target_label: tier
        replacement: 'app'

      # Default tier for anything not matched above (future services):
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        regex: '^.*$'
        target_label: tier
        replacement: 'other'

      # ------------------------------------------------------------------------
      # Label: stream
      # ------------------------------------------------------------------------
      # Docker distinguishes stdout and stderr. Preserve as a label.
      # Cardinality: 2. Cheap.
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream

      # ------------------------------------------------------------------------
      # Cleanup: drop metadata labels we don't need
      # ------------------------------------------------------------------------
      # Promtail discovers many __meta_docker_* labels. Only the ones we
      # explicitly target survive into Loki. The rest are internal to
      # Promtail's service discovery and are automatically dropped, EXCEPT
      # for a few that Promtail retains as labels unless we say otherwise.
      #
      # We explicitly drop the ones we don't want:
      - action: labeldrop
        regex: '^__meta_docker_container_label_(com_docker_compose_(config_hash|container_number|oneoff|project_config_files|project_working_dir|version)|org_opencontainers_image_(created|description|revision|source|title|url|version))$'

      # Also drop the raw container id label (we have `container` already):
      - action: labeldrop
        regex: '^__meta_docker_container_id$'

    # --------------------------------------------------------------------------
    # Pipeline stages — parse and transform log lines
    # --------------------------------------------------------------------------
    # Stages run in order for each log line. They can add labels, modify
    # the log body, or extract structured metadata.
    # --------------------------------------------------------------------------
    pipeline_stages:

      # ------------------------------------------------------------------------
      # Stage 1: Docker json-file unwrapping
      # ------------------------------------------------------------------------
      # Docker's json-file driver wraps each log line:
      #   {"log":"<actual message>\n","stream":"stdout","time":"2024-..."}
      #
      # The `docker` stage extracts the `log` field (the actual message) and
      # uses `time` for the timestamp. The outer JSON is discarded.
      #
      # This stage is MANDATORY when reading Docker json-file logs. Without
      # it, every log line in Loki would be the raw wrapper JSON.
      # ------------------------------------------------------------------------
      - docker: {}

      # ------------------------------------------------------------------------
      # Stage 2: Optional JSON parsing of the message
      # ------------------------------------------------------------------------
      # After stage 1, the log line is the actual message. If the
      # application emits structured JSON (our Phase 1+ services will),
      # parse it here.
      #
      # If the message is NOT JSON (e.g., a stack trace, or the raw output
      # of `psql`), the stage would normally fail. We use `on_failure: []`
      # (empty list) to silently pass the line through unparsed.
      #
      # Fields extracted:
      #   level     — log severity (DEBUG/INFO/WARN/ERROR/FATAL)
      #   trace_id  — OpenTelemetry trace ID for cross-linking to Tempo
      #   span_id   — OpenTelemetry span ID
      #   timestamp — the application's timestamp (preferred over Docker's)
      #
      # This stage runs for every container. For containers that don't
      # emit JSON (Postgres, Redis, etc.), the stage is a no-op.
      # ------------------------------------------------------------------------
      - json:
          expressions:
            level: level
            trace_id: trace_id
            span_id: span_id
            timestamp: timestamp
          # If parsing fails (not JSON), pass through unchanged.
          on_failure: []

      # ------------------------------------------------------------------------
      # Stage 3: Timestamp override
      # ------------------------------------------------------------------------
      # If the JSON parse extracted a `timestamp` field, use it instead of
      # Docker's receive time. This gives us the application's view of when
      # the event happened.
      #
      # Format: RFC3339 with nanoseconds. Matches what Java's
      # `DateTimeFormatter.ISO_INSTANT` produces.
      #
      # If the field is missing or malformed, `skip` means we keep Docker's
      # timestamp instead of failing.
      # ------------------------------------------------------------------------
      - timestamp:
          source: timestamp
          format: RFC3339Nano
          action_on_failure: skip
          # Fallback: if no timestamp in the message, use the Docker
          # json-file timestamp (already set by the `docker` stage above).

      # ------------------------------------------------------------------------
      # Stage 4: Promote `level` to a label
      # ------------------------------------------------------------------------
      # Log level is a low-cardinality field (5-7 distinct values) that's
      # frequently used in queries. Promoting it to a label makes those
      # queries fast.
      #
      # Only promote if the field was successfully extracted. If the message
      # wasn't JSON, `level` won't exist — the labels stage silently does
      # nothing in that case.
      # ------------------------------------------------------------------------
      - labels:
          level:

      # ------------------------------------------------------------------------
      # Stage 5: Attach trace_id and span_id as structured metadata
      # ------------------------------------------------------------------------
      # These have HIGH cardinality (one per request), so they must NOT be
      # labels. Structured metadata is Loki 3.0+'s mechanism for attaching
      # per-line key-value pairs that are queryable but don't create streams.
      #
      # This is what makes the Loki → Tempo cross-link (File 16) work: a
      # query for a specific trace_id returns only the logs for that trace,
      # without having created a stream per trace_id.
      # ------------------------------------------------------------------------
      - structured_metadata:
          trace_id:
          span_id:

      # ------------------------------------------------------------------------
      # Stage 6: Drop noisy debug lines (optional)
      # ------------------------------------------------------------------------
      # In production, DEBUG-level logs can dominate volume. This stage
      # drops them to save storage.
      #
      # For Phase 0, we do NOT drop debug lines — dev benefits from seeing
      # everything. Enable this in prod by uncommenting.
      #
      # Alternatively, adjust Loki's per-stream retention (File 18) to keep
      # DEBUG logs for a shorter period.
      # ------------------------------------------------------------------------
      # - match:
      #     selector: '{compose_project="omp"} |~ "level=DEBUG"'
      #     action: drop
      #     drop_counter_reason: debug_logs_dropped

      # ------------------------------------------------------------------------
      # Stage 7: Output — clean up the final log line
      # ------------------------------------------------------------------------
      # If the JSON parse extracted fields, we might want the log line
      # rewritten to exclude those fields (they're now in labels/metadata).
      # Or we might want to keep the full original JSON for completeness.
      #
      # Decision: keep the full JSON. The body is queryable, and having
      # the complete original makes forensics easier. The overhead is a
      # few bytes per line.
      #
      # To strip extracted fields, uncomment:
      # - output:
      #     source: message
      #
      # This would replace the log body with just the `message` field from
      # the parsed JSON.

# ==============================================================================
# OPERATIONAL NOTES
# ==============================================================================
#
# VERIFYING PROMTAIL IS WORKING
#   Promtail exposes its own metrics on :9080.
#     curl http://promtail:9080/metrics
#
#   Key metrics:
#     promtail_targets_active_total      — number of active scrape targets
#     promtail_dropped_entries_total     — logs dropped (should be 0 or low)
#     promtail_sent_entries_total        — logs successfully sent to Loki
#     promtail_request_duration_seconds  — push request latency
#
# VERIFYING LOGS REACH LOKI
#   After generating some traffic:
#     curl -s "http://loki:3100/loki/api/v1/label/compose_service/values" | jq .
#   Should return the list of services with logs.
#
#   Or query from Grafana Explore using the Loki datasource:
#     {compose_project="omp"}
#
# TROUBLESHOOTING
#   No logs in Loki at all
#     1. Check Promtail is running: docker compose ps promtail
#     2. Check Promtail logs: docker compose logs promtail | tail -50
#     3. Verify Docker socket is mounted: docker compose exec promtail ls -l /var/run/docker.sock
#     4. Verify Promtail has read access to log files:
#        docker compose exec promtail ls /var/lib/docker/containers | head
#     5. Verify Loki is reachable: docker compose exec promtail wget -qO- http://loki:3100/ready
#
#   Some containers' logs missing
#     - Verify the container has the label `com.docker.compose.project=omp`.
#       Containers started by `docker run` (not compose) don't have it.
#     - Check the relabel config's `keep` rule: it filters on this label.
#
#   Logs are too high cardinality (Loki complains "per-user streams limit exceeded")
#     - Check which labels have high cardinality:
#         curl -s http://loki:3100/metrics | grep loki_ingester_memory_streams
#     - Query Loki for unique label values:
#         curl -s "http://loki:3100/loki/api/v1/labels"
#     - If a label like `container` has thousands of values, the Docker
#       service discovery is picking up more containers than expected.
#       Tighten the `keep` relabel rule.
#
#   Non-JSON logs are being dropped
#     - Verify `on_failure: []` is set on the json stage (it should pass
#       through malformed lines).
#     - Check Loki for entries with `stream="stderr"` — stack traces and
#       errors often go to stderr and may not be JSON.
#
#   Duplicate log lines in Loki
#     - Promtail positions file is missing or not mounted, so restarts
#       re-read all logs. Verify `/var/lib/promtail/positions.yaml` exists
#       inside the container and persists across restarts.
#
# ==============================================================================
# END OF promtail-config.yml
# ==============================================================================