# Tempo 3 monolithic mode; local storage is private to this single host.
# https://grafana.com/docs/tempo/latest/set-up-for-tracing/setup-tempo/upgrade/
stream_over_http_enabled: true
server:
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
storage:
  trace:
    backend: local
    wal:
      path: /tmp/tempo/wal
    local:
      path: /tmp/tempo/blocks
overrides:
  defaults:
    compaction:
      block_retention: 1h
usage_report:
  reporting_enabled: false
