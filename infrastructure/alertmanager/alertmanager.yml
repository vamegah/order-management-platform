# Local recording receivers. Production is rendered from mounted receiver inputs; no dotenv interpolation.
global:
  resolve_timeout: 1m
route:
  receiver: operations
  group_by:
  - env
  - service
  - alertname
  group_wait: 5s
  group_interval: 15s
  repeat_interval: 4h
  routes:
  - receiver: critical
    matchers:
    - severity="critical"
    group_wait: 0s
    repeat_interval: 1h
inhibit_rules:
- source_matchers:
  - severity="critical"
  target_matchers:
  - severity="warning"
  equal:
  - env
  - service
  - alertname
receivers:
- name: operations
  webhook_configs:
  - url: http://alert-receiver:8080/operations
    send_resolved: true
    max_alerts: 50
    http_config:
      follow_redirects: false
      enable_http2: false
- name: critical
  webhook_configs:
  - url: http://alert-receiver:8080/critical
    send_resolved: true
    max_alerts: 50
    http_config:
      follow_redirects: false
      enable_http2: false
