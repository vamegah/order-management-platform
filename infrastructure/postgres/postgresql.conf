# ==============================================================================
# Order Management Platform — PostgreSQL Configuration (Development)
# ------------------------------------------------------------------------------
# FILENAME : postgresql.conf
# MOUNTED  : /etc/postgresql/postgresql.conf (read-only)
# USED BY  : docker-compose.yml (postgres service) via:
#               command: postgres -c config_file=/etc/postgresql/postgresql.conf
#
# THIS FILE REPLACES THE IMAGE DEFAULT
#   The official Postgres Docker image ships a `postgresql.conf` with sensible
#   defaults. When we mount this file, that one is ignored entirely — Postgres
#   uses exactly what's here, falling back to internal compiled defaults for
#   anything we don't specify.
#
#   That's why this file is COMPLETE-ish. Where a setting matters, it's set
#   explicitly. Where it doesn't, the compiled default is documented as such
#   so a reader knows it wasn't forgotten.
#
# FOR PRODUCTION
#   Use postgresql.prod.conf (File 9) instead. The prod file changes:
#     - Sizing (shared_buffers, work_mem, maintenance_work_mem, max_connections)
#     - WAL archiving (archive_mode = on, archive_command for pgBackRest)
#     - Logging (JSON format, longer retention, stricter slow-query threshold)
#
# REFERENCE
#   For the full list of Postgres 16 settings, see:
#     https://www.postgresql.org/docs/16/runtime-config.html
#   Or inside the container:
#     docker compose exec postgres cat /usr/share/postgresql/postgresql.conf.sample
# ==============================================================================

# ==============================================================================
# SECTION 1 — FILE LOCATIONS
# ------------------------------------------------------------------------------
# These are set by the Docker image and shouldn't be changed here. Listed for
# completeness so a reader knows where to find things.
# ==============================================================================

# data_directory     = '/var/lib/postgresql/data'   # set by Docker image
# hba_file           = '/var/lib/postgresql/data/pg_hba.conf'   # image default
# ident_file         = '/var/lib/postgresql/data/pg_ident.conf' # image default
# external_pid_file  = ''                            # not used in container

# ==============================================================================
# SECTION 2 — CONNECTIONS AND AUTHENTICATION
# ==============================================================================

# Listen on all interfaces. Required for the container to be reachable from
# other containers on the Docker network. Access control is handled by
# pg_hba.conf (managed by the image), not by listen_addresses.
listen_addresses = '*'

# Port. Must match what the Docker image exposes and what the compose file
# maps. Changing this requires updating the compose healthcheck, the JDBC URLs
# in every service, and the pgAdmin server definition.
port = 5432

# Dev-only: plenty for the handful of services we'll run. Prod overlay raises
# this to 200. Each connection costs ~10MB of RSS, so 100 × 10MB = 1GB of
# potential memory just for connections.
max_connections = 100

# Reserved for superuser. Ensures an admin can always connect even when the
# regular pool is exhausted. 3 is a common number — one per active admin, plus
# one for emergencies.
superuser_reserved_connections = 3

# Unix domain socket directory. Irrelevant in our container setup (TCP only),
# but listed because leaving it unset on some platforms causes confusion.
# Default: /var/run/postgresql (set by the image)
# unix_socket_directories = '/var/run/postgresql'   # image default

# ==============================================================================
# SECTION 3 — MEMORY
# ------------------------------------------------------------------------------
# These are the settings where dev and prod diverge most. The prod file uses
# the standard 25% / 75% rules based on host RAM. Dev is intentionally small
# so multiple projects can run side by side without a laptop swap.
#
# THE THREE MOST IMPORTANT MEMORY SETTINGS
#   shared_buffers       — Postgres's own page cache. Bigger is better, up to
#                          ~25% of host RAM, beyond which the OS page cache
#                          (which is also caching the same files) becomes the
#                          bottleneck.
#   work_mem             — Per-operation memory for sorts and hashes. NOT a
#                          global budget: a single query can use several
#                          work_mem allocations simultaneously. Setting this
#                          too high causes OOM under concurrent load.
#   maintenance_work_mem — Memory for VACUUM, CREATE INDEX, ALTER TABLE.
#                          Higher means faster maintenance.
# ==============================================================================

# 256MB — small but sufficient for dev workloads (a few hundred MB of data).
# Prod: 25% of RAM (e.g., 4GB on a 16GB host).
shared_buffers = 256MB

# 8MB — enough for dev-sized sorts. The default of 4MB is too small for
# anything but the simplest queries; 8MB is a safe step up.
# Prod: 16–32MB depending on query patterns.
work_mem = 8MB

# 64MB — VACUUM and CREATE INDEX will be slow at this size, but dev databases
# are tiny. Prod: 512MB–1GB.
maintenance_work_mem = 64MB

# 1GB — tells the planner how much OS cache is available for data files. This
# is a HINT, not an allocation. Postgres doesn't reserve this memory; it just
# uses the number when estimating whether an index scan is cheaper than a
# sequential scan. On a dev laptop with 16GB RAM, 1GB is a reasonable estimate
# of what the OS has cached. Too low = planner picks seq scans too eagerly.
# Too high = planner picks index scans that then miss cache.
effective_cache_size = 1GB

# Per-worker memory for parallel query workers. -1 means "use work_mem".
# Kept at default. Prod may tune this for parallel-heavy workloads.
# min_parallel_table_scan_size = 8MB   # default
# max_parallel_workers_per_gather = 2  # default

# ==============================================================================
# SECTION 4 — WRITE-AHEAD LOG (WAL)
# ------------------------------------------------------------------------------
# WAL is Postgres's durability mechanism: every committed transaction is first
# written to the WAL, then later applied to data files. Settings here control
# how much WAL is generated per transaction and how often it's flushed.
#
# DEV vs PROD
#   Dev:   wal_level = replica (needed for pgBackRest to work in either env,
#          but dev doesn't archive), fsync = on (safety over speed), minimal
#          WAL size.
#   Prod:  wal_level = replica, archive_mode = on, archive_command points at
#          pgBackRest, larger WAL segments and buffers to handle write volume.
# ==============================================================================

# `replica` is the minimum WAL level that supports replication and online
# backups. Any lower and pgBackRest cannot take incremental backups.
# Requires restart to change.
wal_level = replica

# fsync = on ensures committed transactions are durable — the WAL is flushed
# to disk before COMMIT returns. Turning this off is a common "performance
# trick" that trades durability for speed. NEVER do that in production, and
# generally don't in dev either — a crash with fsync off can corrupt the DB.
fsync = on

# synchronous_commit = on (default) means COMMIT waits for the WAL to be
# fsync'd. Alternatives:
#   off        — async commit (fast, loses up to ~3 WAL writes on crash)
#   local      — waits for local fsync but not replicas
#   remote_write — waits for replicas to receive (not fsync)
#   on         — waits for local fsync (default, safest)
#   remote_apply — waits for replicas to apply
# We keep the default. If any service later has a "performance vs durability"
# profile (e.g., analytics ingestion), that service can set its own level via
# ALTER ROLE ... SET synchronous_commit = off.
synchronous_commit = on

# WAL buffers. Higher means fewer fsyncs when the WAL is written in bursts.
# Default 16MB is fine for dev; prod with high write volume uses 64MB.
# wal_buffers = 16MB   # default (-1 = auto-tune)

# Minimum WAL size to keep around. Larger = more space for replicas to lag,
# at the cost of disk. Dev keeps the default. Prod may raise this.
# min_wal_size = 80MB   # default
# max_wal_size = 1GB    # default

# Checkpoint tuning. Defaults are fine for dev.
# checkpoint_timeout = 5min        # default
# checkpoint_completion_target = 0.9  # default (PG14+)
# max_wal_size affects how often checkpoints happen.

# ==============================================================================
# SECTION 5 — REPLICATION
# ------------------------------------------------------------------------------
# Dev runs a single Postgres instance with no replicas, but we still declare
# replication settings that mirror prod so the file is a complete reference.
# ==============================================================================

# Number of simultaneous replication connections. Dev: 0 (no replicas).
# Prod: at least 3 (2 replicas + 1 headroom for pg_basebackup).
max_wal_senders = 0

# Slots for logical replication. Not used yet.
max_replication_slots = 0

# Streaming replication feedback interval. Not relevant in dev.
# wal_receiver_timeout = 60s   # default

# ==============================================================================
# SECTION 6 — QUERY PLANNER
# ------------------------------------------------------------------------------
# These affect the planner's cost estimates. The defaults work well for
# general workloads; we only set them explicitly where the standard advice
# differs from the default.
# ==============================================================================

# Cost of reading a random page (as a multiple of a sequential page).
# 4.0 is Postgres's default and is calibrated for spinning disks. On SSDs,
# a value of 1.1–1.5 is often better because random reads are much cheaper.
# We keep the default (4.0) for dev because we can't know the storage type
# of every developer's machine. Prod on NVMe may tune this to 1.1.
# random_page_cost = 4.0   # default

# Effective concurrency for I/O cost estimation. Default 1.0 means "assume
# one I/O at a time." On SSDs that support parallel I/O, 2.0 can lead to
# better plans. Default is safe.
# effective_io_concurrency = 1   # default (HINT: 200 for NVMe)

# Default statistics target. Higher = more accurate planner estimates and
# more ANALYZE time. 100 is the default and works for most tables.
# default_statistics_target = 100   # default

# ==============================================================================
# SECTION 7 — ERROR REPORTING AND LOGGING
# ------------------------------------------------------------------------------
# This is where dev and prod differ most in style. Dev wants readable text
# logs that a human can scan while tailing `docker compose logs`. Prod wants
# structured JSON that Loki/ELK can parse.
#
# LOG DESTINATION
#   The Docker image routes logs to stdout (which Docker captures). We do NOT
#   enable logging_collector (which would write to files inside the container
#   — those would be lost on container restart).
# ==============================================================================

# --------- Log destination ---------

# Log to stderr, which Docker captures as stdout. This is the image's default
# and the correct choice for containers.
log_destination = 'stderr'

# Do NOT collect logs into files inside the container. Docker handles log
# collection and rotation (see File 2a's `logging.options`).
logging_collector = off

# --------- Log format ---------

# Dev: readable plain text. Prod: 'json' so structured log systems can parse
# it. The format template below is applied when log_destination is stderr.
log_line_prefix = '%m [%p] %q%u@%d/%a '

# What each escape means:
#   %m — timestamp with milliseconds (e.g., 2024-11-15 14:23:45.123 UTC)
#   %p — process ID
#   %q — stop here in non-session processes (produces empty string)
#   %u — user name
#   %d — database name
#   %a — application name (set via JDBC application_name parameter)
#
# Example log line:
#   2024-11-15 14:23:45.123 UTC [42] orders_svc@omp/order-service LOG: ...
#
# The application_name (%a) is what makes this useful: when order-service
# connects, it sets application_name = 'order-service', and every log line
# shows which service triggered the query. This is how we correlate DB logs
# with application traces in Phase 7.

# --------- What to log ---------

# Log connections and disconnections. Useful in dev to see which services are
# connecting when; useful in prod for audit trails.
log_connections = on
log_disconnections = on

# Log the duration of every completed statement. -1 means "don't log unless
# the statement exceeds log_min_duration_statement" (which is also -1 here,
# effectively disabling duration logging entirely at the DB level).
#
# Per-role overrides in File 6 set log_min_duration_statement = 1000 for
# application roles — so slow queries are logged per-session, but the
# DB-wide setting is off. This avoids logging every query in dev while still
# catching slow ones.
log_duration = off

# Log statements slower than this. -1 = disabled at the DB level. Per-role
# overrides in File 6 handle the actual slow-query logging.
log_min_duration_statement = -1

# Log failed queries. On by default.
# log_min_error_statement = error   # default

# Log the level of severity that goes to the client. 'warning' is standard.
# client_min_messages = warning   # default

# --------- DDL and DML logging ---------

# Log every DDL statement (CREATE, ALTER, DROP, TRUNCATE). Useful for audit
# and for debugging migration issues. In dev, this shows what Flyway is doing
# in real time.
log_statement = 'ddl'

# Values for log_statement:
#   none     — no statement logging (default)
#   ddl      — CREATE, ALTER, DROP, TRUNCATE (we choose this)
#   mod      — ddl + INSERT, UPDATE, DELETE, COPY FROM
#   all      — everything (very noisy, rarely useful)

# Log checkpoints. On by default. Useful for understanding WAL behavior.
# log_checkpoints = on   # default

# Log autovacuum activity. On in dev to see vacuum timing during development.
log_autovacuum_min_duration = 0

# --------- Error verbosity ---------

# 'default' includes the error message, hint, and detail. 'verbose' adds
# source file, line number, and other internals. Dev uses 'default' for
# readability; if debugging a Postgres bug, temporarily switch to 'verbose'.
log_error_verbosity = default

# ==============================================================================
# SECTION 8 — STATISTICS AND MONITORING
# ------------------------------------------------------------------------------
# Critical section. This is where `pg_stat_statements` gets loaded, which
# File 7 depends on. Removing this line would break the extension.
# ==============================================================================

# Preload pg_stat_statements. This MUST be set before Postgres starts — the
# extension hooks into the planner and executor at library-load time, which
# happens once per server startup. Cannot be changed at runtime.
#
# If this line is missing or misspelled:
#   - File 7's CREATE EXTENSION pg_stat_statements fails with:
#       ERROR: pg_stat_statements must be loaded via shared_preload_libraries
#   - The verification block in File 7 raises an exception
#   - The container fails to complete init and exits
#
# Multiple libraries can be comma-separated. Phase 7 will add 'pg_cron' here
# when we introduce scheduled cleanup jobs.
shared_preload_libraries = 'pg_stat_statements'

# Control how many distinct queries pg_stat_statements tracks. Higher = more
# memory + more complete stats. 5000 covers the vast majority of applications.
pg_stat_statements.max = 5000

# Only track statements from this many top-level statements down. 0 = track
# all. Higher values reduce overhead but lose detail.
pg_stat_statements.track = top

# Track utility statements (VACUUM, ANALYZE, etc.)? 'none' is the default.
# 'all' would include DDL in the stats, which is sometimes useful but noisy.
pg_stat_statements.track_utility = on

# Save query text for queries that are truncated in pg_stat_statements output.
# Keeping this on (default) helps reconstruct what was executed.
pg_stat_statements.save = on

# ==============================================================================
# SECTION 9 — AUTOVACUUM
# ------------------------------------------------------------------------------
# Autovacuum reclaims dead tuple space and updates statistics. Tuning is
# workload-dependent; defaults work for most cases. Aggressive tuning helps
# high-write workloads (like our notifications and payments tables in later
# phases). We keep defaults in dev; prod may tighten them.
# ==============================================================================

# Enable autovacuum. Default on; disabling is almost always wrong.
autovacuum = on

# How often autovacuum wakes up to check for work.
# autovacuum_naptime = 1min   # default

# Scale factors control how aggressively each table is vacuumed. Lower = more
# frequent, more aggressive. Dev keeps defaults; Phase 5+ may lower these for
# high-churn tables.
# autovacuum_vacuum_scale_factor = 0.2       # default
# autovacuum_analyze_scale_factor = 0.1      # default
# autovacuum_vacuum_cost_limit = 200         # default
# autovacuum_vacuum_cost_delay = 2ms         # default

# ==============================================================================
# SECTION 10 — CLIENT CONNECTION DEFAULTS
# ------------------------------------------------------------------------------
# These provide sensible defaults for connections that don't specify values.
# Per-role overrides (File 6) take precedence for application roles.
# ==============================================================================

# Timezone. Everything stored as UTC; clients render in local time.
timezone = 'UTC'

# Date format. 'ISO, MDY' matches the international standard and is
# unambiguous. The 'MDY' part only affects ambiguous inputs like '01/02/2024'.
datestyle = 'ISO, MDY'

# Text search config. Phase 1+ search features use this.
default_text_search_config = 'pg_catalog.english'

# Character encoding. UTF-8 is the only sane choice for a modern app.
# Set at initdb time (File 2a passes --encoding=UTF8), not here, but noted.
# client_encoding = 'UTF8'   # set by client, defaults to server encoding

# Statement and lock timeouts at the DB level (not per-role). Per-role
# settings in File 6 override these for application roles. Setting them here
# as a fallback protects against ad-hoc connections that don't go through
# the service roles.
statement_timeout = '60s'
lock_timeout = '10s'
idle_in_transaction_session_timeout = '120s'

# ==============================================================================
# SECTION 11 — LOCALE AND FORMATTING
# ------------------------------------------------------------------------------
# Set at initdb time; not changeable here. Documented for reference.
# ==============================================================================

# lc_messages = 'C'            # initdb-time
# lc_monetary = 'C'            # initdb-time
# lc_numeric = 'C'             # initdb-time
# lc_time = 'C'                # initdb-time
# default_text_search_config — see section 10

# ==============================================================================
# SECTION 12 — LOCK MANAGEMENT
# ------------------------------------------------------------------------------
# deadlock_timeout is how long Postgres waits before checking for a deadlock.
# Too low = expensive checks; too high = slow detection. 1s is the default
# and works well.
# ==============================================================================

# deadlock_timeout = 1s   # default

# max_locks_per_transaction — number of locks each transaction can hold.
# Higher values are needed for complex DDL (partitioned tables, etc.).
# Default 64 is fine; Phase 5's partitioning may need more.
# max_locks_per_transaction = 64   # default

# ==============================================================================
# SECTION 13 — JIT (JUST-IN-TIME COMPILATION)
# ------------------------------------------------------------------------------
# Postgres 11+ can JIT-compile query plans using LLVM. This helps large
# analytical queries (10s of millions of rows) but hurts short OLTP queries.
# The cost thresholds default to values that only trigger JIT for genuinely
# expensive queries.
# ==============================================================================

# jit = on                     # default
# jit_above_cost = 100000      # default — JIT only for expensive plans
# jit_inline_above_cost = 500000    # default
# jit_optimize_above_cost = 500000  # default

# ==============================================================================
# SECTION 14 — BACKGROUND WRITER
# ------------------------------------------------------------------------------
# Flushes dirty pages from shared_buffers to disk in the background. Defaults
# are tuned well; only adjust if you observe checkpoint-related I/O spikes.
# ==============================================================================

# bgwriter_delay = 200ms               # default
# bgwriter_lru_maxpages = 100          # default
# bgwriter_lru_multiplier = 2.0        # default
# bgwriter_flush_after = 512kB         # default (PG14+)

# ==============================================================================
# SECTION 15 — ASYNCHRONOUS I/O
# ------------------------------------------------------------------------------
# io_method controls how Postgres performs asynchronous disk I/O. Postgres 16
# added `io_uring` as an option for Linux kernels that support it. `worker`
# (default) is universally compatible; `io_uring` is faster on modern Linux
# but requires kernel 5.1+ and liburing.
# ==============================================================================

# io_method = 'worker'   # default (Postgres 16)
# io_workers = 3         # default (Postgres 16)

# ==============================================================================
# SECTION 16 — CUSTOM / EXTENSION SETTINGS
# ------------------------------------------------------------------------------
# Extension-specific settings. pg_stat_statements settings are in section 8.
# ==============================================================================

# Example: If pg_cron is enabled later (Phase 7), uncomment and add to
# shared_preload_libraries:
#     shared_preload_libraries = 'pg_stat_statements,pg_cron'
#     cron.database_name = 'omp'
#     cron.timezone = 'UTC'

# ==============================================================================
# SECTION 17 — SECURITY
# ------------------------------------------------------------------------------
# Row-level security is enabled per-table when needed. No global settings here.
# SSL is handled by the Docker network (internal) and Traefik (edge) — the
# Postgres protocol itself is not TLS in this setup. If you need TLS to
# Postgres (e.g., cross-host access in a future multi-host deployment), set:
#     ssl = on
#     ssl_cert_file = '/path/to/server.crt'
#     ssl_key_file  = '/path/to/server.key'
# in the prod overlay.
# ==============================================================================

# ==============================================================================
# SUMMARY OF INTENTIONAL DEVIATIONS FROM POSTGRES 16 DEFAULT
# ------------------------------------------------------------------------------
# Everything else in this file matches Postgres 16 defaults, or is set by the
# Docker image. The settings we explicitly chose are:
#
#   max_connections         = 100         (dev scale, from default 100)
#   shared_buffers          = 256MB       (dev scale, from default 128MB)
#   work_mem                = 8MB         (dev scale, from default 4MB)
#   maintenance_work_mem    = 64MB        (dev scale, from default 64MB)
#   effective_cache_size    = 1GB         (dev estimate, from default 4GB)
#   wal_level               = replica     (default is replica in PG16)
#   log_connections         = on          (default is off)
#   log_disconnections      = on          (default is off)
#   log_statement           = 'ddl'       (default is none)
#   log_autovacuum_min_duration = 0       (default is 10min)
#   shared_preload_libraries = 'pg_stat_statements'  (default is empty)
#   pg_stat_statements.*    = (multiple)  (defaults when extension loaded)
#   statement_timeout       = 60s         (default is 0 = off)
#   lock_timeout            = 10s         (default is 0 = off)
#   idle_in_transaction_session_timeout = 120s  (default is 0 = off)
#
# Everything else is default.
#
# ==============================================================================
# END OF postgresql.conf
# ==============================================================================