# ==============================================================================
# Order Management Platform — PostgreSQL Configuration (Production)
# ------------------------------------------------------------------------------
# FILENAME : postgresql.prod.conf
# MOUNTED  : /etc/postgresql/postgresql.conf (read-only) when the prod overlay
#            is applied:
#              docker compose -f docker-compose.yml \
#                             -f docker-compose.prod.yml \
#                             --env-file .env.prod up -d
#
# THIS FILE OVERRIDES postgresql.conf (dev)
#   Anything set here replaces the dev value. Anything NOT set here keeps
#   dev's value. The rule: this file only lists settings that DIFFER from
#   dev, plus a few critical settings copied verbatim to prevent accidental
#   drift.
#
# REFERENCE HOST SIZING
#   The values below assume a reference host with:
#     - 16 GB RAM
#     - 8 CPU cores
#     - NVMe SSD storage
#     - Docker with no other heavy workloads
#
#   To scale to a different host, apply the standard rules:
#     shared_buffers        = 25% of RAM
#     effective_cache_size  = 75% of RAM
#     maintenance_work_mem  = 5% of RAM (max 2GB)
#     work_mem              = (RAM - shared_buffers) / (max_connections * 2)
#
#   For a 32GB host: shared_buffers=8GB, effective_cache_size=24GB, etc.
#   For a 128GB host: shared_buffers=32GB, effective_cache_size=96GB, etc.
#
#   A future enhancement will compute these at boot from host RAM. For now
#   they're static and clearly documented.
#
# ==============================================================================

# ==============================================================================
# SECTION 1 — CONNECTIONS (unchanged from dev except limits)
# ==============================================================================

listen_addresses = '*'
port = 5432

# 200 — twice dev, sized for all Phase 1+ services with generous pools plus
# admin/monitoring headroom. Each connection costs ~10MB backend memory;
# 200 × 10MB = 2GB reserved when all connections are active.
#
# If this becomes a bottleneck: add pgbouncer between services and Postgres.
# The app-side pool can be 1000s of connections while Postgres-side stays
# at 200.
max_connections = 200

# Reserved for superuser + replication. 5 gives room for:
#   - 1 admin shell
#   - 1 pgBackRest connection
#   - 1 monitoring connection
#   - 2 headroom
superuser_reserved_connections = 5

# ==============================================================================
# SECTION 2 — MEMORY (scaled for 16GB host)
# ------------------------------------------------------------------------------
# These are the settings that most directly affect performance. Every one of
# them is tied to host RAM. The comments show the derivation so a future
# operator can recompute for a different host.
# ==============================================================================

# 4GB — 25% of 16GB host RAM. The standard Postgres recommendation.
# Above 25%, the OS page cache (which also caches Postgres files) gets
# squeezed, and you see diminishing returns or worse.
shared_buffers = 4GB

# 24MB — derived as (16GB - 4GB) / (200 connections × 2) ≈ 30MB.
# Rounded down to 24MB for safety margin.
#
# WARNING: work_mem is PER OPERATION, not per connection. A single complex
# query with 3 sorts uses 3 × work_mem. Setting this too high causes OOM
# under concurrent load.
work_mem = 24MB

# 512MB — 3% of RAM, sufficient for VACUUM and CREATE INDEX on prod-sized
# tables. Cap is usually 2GB; beyond that, diminishing returns.
maintenance_work_mem = 512MB

# 12GB — 75% of host RAM. This is a planner HINT, not an allocation.
# Represents the OS page cache available for Postgres data files.
effective_cache_size = 12GB

# ==============================================================================
# SECTION 3 — WRITE-AHEAD LOG (production durability + backups)
# ------------------------------------------------------------------------------
# This is where prod diverges most from dev. The critical change is
# archive_mode = on + archive_command, which enables pgBackRest to take
# continuous backups and provide point-in-time recovery (PITR).
# ==============================================================================

# Keep wal_level = replica. Required for:
#   - pgBackRest incremental backups (which read WAL)
#   - Streaming replication (if we add a standby)
#   - Any logical replication on top (which requires 'logical', but we don't
#     use logical replication currently)
#
# REQUIRES RESTART. Cannot be changed at runtime.
wal_level = replica

# fsync = on. Never disable in production. This is what makes COMMIT
# durable. If you're reading this and considering setting fsync = off
# "because the benchmarks look better," stop. You will lose data on the
# next crash. There is no scenario where this is the right choice.
fsync = on

# synchronous_commit = on. COMMIT waits for WAL fsync.
# A service that legitimately needs async commit (analytics ingestion, log
# shipping) can set `SET LOCAL synchronous_commit = off` per-transaction.
# We don't weaken the default.
synchronous_commit = on

# ------------------------------------------------------------------------------
# WAL ARCHIVING — the production-critical addition
# ------------------------------------------------------------------------------
# archive_mode = on tells Postgres to invoke archive_command on every
# completed WAL segment (16MB by default). Combined with pgBackRest, this
# gives continuous backup and point-in-time recovery.
#
# REQUIRES RESTART. Cannot be changed at runtime.
archive_mode = on

# archive_command — invoked for each WAL segment. %p is the path to the
# segment being archived.
#
# pgbackrest --stanza=omp archive-push %p:
#   - Encrypts the segment (aes-256-cbc, key from secret)
#   - Uploads to the configured repository
#   - Returns 0 on success, non-zero on failure
#
# CRITICAL: if this command returns non-zero, Postgres RETAINS the WAL file
# and retries every 60 seconds. If archiving stays broken long enough, the
# data directory fills and Postgres crashes. The pgBackRest repo MUST be
# reachable at all times. Monitor archive_command failures (Phase 7).
#
# DO NOT add shell operators (|, >, &, ;) to this command. Postgres uses
# a strict shell parse and shell operators can break it or create security
# issues. Keep it a simple single-command invocation.
archive_command = 'pgbackrest --stanza=omp --repo=1 archive-push %p'

# On a warm standby, a restore_command is needed (fetch WAL from archive
# during recovery). We don't run a standby yet; uncomment when we do.
# restore_command = 'pgbackrest --stanza=omp archive-get %f "%p"'

# Archive timeout — force a WAL switch if no segment completes within this
# window. Ensures low-activity periods don't delay archiving indefinitely.
# 300s (5min) is a common choice: bounded RPO (recovery point objective).
archive_timeout = 300s

# ------------------------------------------------------------------------------
# WAL SIZING — larger than dev to reduce checkpoint frequency
# ------------------------------------------------------------------------------
# max_wal_size is the soft limit on WAL between automatic checkpoints.
# Larger = fewer checkpoints = less I/O spiking, but longer crash recovery.
# 4GB is a good balance for a 16GB host.
max_wal_size = 4GB

# min_wal_size is the floor — WAL is kept around this size even during idle
# periods, to avoid rapid growth/shrink cycles.
min_wal_size = 1GB

# WAL buffers. 64MB reduces fsync pressure during write bursts. Auto-tuned
# by default (-1) to ~16MB; 64MB is a common production choice for busy hosts.
wal_buffers = 64MB

# Checkpoint frequency. 15min (vs default 5min) reduces checkpoint I/O
# frequency. Combined with 4GB max_wal_size, checkpoints happen roughly
# every 15min or when 4GB of WAL accumulates, whichever comes first.
checkpoint_timeout = 15min

# Spread checkpoint I/O across this fraction of checkpoint_timeout. 0.9
# means "write 90% of the checkpoint's dirty pages over 90% of the
# checkpoint window." This smooths I/O and avoids end-of-checkpoint spikes.
checkpoint_completion_target = 0.9

# Log each checkpoint's stats. Useful for observing checkpoint behavior and
# detecting checkpoint-driven I/O problems.
log_checkpoints = on

# ==============================================================================
# SECTION 4 — REPLICATION (prepared for future standby)
# ------------------------------------------------------------------------------
# We don't run a standby yet, but the settings are sized to support one
# without a restart. Streaming replication requires a restart to add a
# standby anyway (hba.conf changes), but the WAL sender limit doesn't.
# ==============================================================================

# 5 simultaneous WAL sender processes:
#   - 2 for potential streaming replicas
#   - 1 for pg_basebackup during initial backup creation
#   - 2 headroom
max_wal_senders = 5

# 5 replication slots:
#   - 2 for standby replication (physical)
#   - 1 for potential logical replication
#   - 2 headroom
#
# WARNING: an unused physical slot retains WAL indefinitely and can fill the
# disk. Monitor slot usage. `max_slot_wal_keep_size` mitigates this:
#   max_slot_wal_keep_size = 10GB
# Above this size, the slot is invalidated (replica must resync). This is
# better than filling the disk.
max_replication_slots = 5
max_slot_wal_keep_size = 10GB

# ==============================================================================
# SECTION 5 — QUERY PLANNER (SSD/NVMe tuned)
# ------------------------------------------------------------------------------
# Dev leaves these at spinning-disk defaults because we can't know every
# developer's storage. Prod knows it's on NVMe.
# ==============================================================================

# 1.1 — random reads are nearly as fast as sequential on NVMe. This makes
# the planner much more willing to choose index scans and bitmap scans.
# Dev uses 4.0 (spinning-disk calibrated).
random_page_cost = 1.1

# 200 — NVMe devices can handle hundreds of parallel I/O ops. This is used
# by the planner to estimate bitmap heap scan cost.
effective_io_concurrency = 200

# 100 — same as dev. Higher values give more accurate estimates at the cost
# of slower ANALYZE. Fine for our workloads.
default_statistics_target = 100

# ==============================================================================
# SECTION 6 — LOGGING (JSON for structured ingestion)
# ------------------------------------------------------------------------------
# Prod logs are ingested by Loki via Docker's json-file driver. JSON log
# format lets Loki extract fields (application_name, user, dbname) without
# regex parsing. Grafana queries filter on these fields directly.
# ==============================================================================

# jsonlog — Postgres 15+ built-in. Each log line is a JSON object with
# well-known keys: timestamp, user, dbname, pid, application_name,
# remote_host, session_id, line_num, ps, message, statement, detail, hint.
log_destination = 'jsonlog'

# Do not collect to files inside the container. Docker captures stdout/stderr
# and its logging driver (see File 2b) handles rotation and shipping.
logging_collector = off

# With jsonlog format, log_line_prefix is ignored. Kept commented for
# clarity.
# log_line_prefix = ''

# --------- What to log ---------

# Log connection/disconnection events. Critical for audit trails in prod
# (SOC 2, PCI DSS).
log_connections = on
log_disconnections = on

# Log DDL statements. Same as dev. Migration audit trail.
log_statement = 'ddl'

# Log every completed statement's duration? No — that would be very noisy.
# We rely on:
#   - log_min_duration_statement (below) for slow queries
#   - pg_stat_statements for query statistics
log_duration = off

# Log statements slower than 1 second. In prod this is the "slow query log"
# — anything hitting this line gets reviewed. App roles also set a per-role
# threshold (File 6); this catches anything else (superuser, ad-hoc).
log_min_duration_statement = 1000

# Log autovacuum runs that take longer than 1 second. Anything faster isn't
# worth the log volume.
log_autovacuum_min_duration = 1000

# Log checkpoints (see section 3). Also log temporary file usage (useful
# for detecting work_mem starvation).
log_temp_files = 0

# Log statements that acquire a lock for longer than this. Helps identify
# blocking chains before they cause outages.
log_lock_waits = on
deadlock_timeout = 1s

# Error verbosity. 'default' for prod — includes message, detail, hint.
# 'verbose' would include source code line numbers, which is useful when
# reporting Postgres bugs but noisy otherwise.
log_error_verbosity = default

# Log replication commands (harmless when unused).
log_replication_commands = on

# Slow log shipping. Log a warning if a WAL file waits more than 30 seconds
# in the archive queue. Early warning for archive_command problems.
# (Postgres 16 feature.)
# log_startup_progress_interval = 10s  # default

# ==============================================================================
# SECTION 7 — STATISTICS
# ==============================================================================
# Same as dev — required for observability. File 7's CREATE EXTENSION
# pg_stat_statements depends on this line.
shared_preload_libraries = 'pg_stat_statements'

# Same as dev.
pg_stat_statements.max = 5000
pg_stat_statements.track = top
pg_stat_statements.track_utility = on
pg_stat_statements.save = on

# Also preload pg_stat_kcache if we add it later (extended stats with OS
# metrics). Would require installing the extension first.
# shared_preload_libraries = 'pg_stat_statements,pg_stat_kcache'

# ==============================================================================
# SECTION 8 — TIMEOUTS (tighter than dev)
# ------------------------------------------------------------------------------
# These are DB-wide fallbacks. Per-role settings (File 6) override for
# application roles.
# ==============================================================================

# Fallback statement timeout: 30s. Any query not running as a service role
# that exceeds this is killed. Application roles have their own timeouts
# (30s for most, 600s for reporting, none for flyway).
statement_timeout = '30s'

# Fallback lock timeout: 5s. A query that can't acquire a lock within 5s
# fails rather than blocking. Prevents cascading lock waits.
lock_timeout = '5s'

# Idle-in-transaction timeout: 60s. A session that opens a transaction and
# then does nothing for 60s gets terminated. Prevents pool exhaustion from
# stuck clients.
idle_in_transaction_session_timeout = '60s'

# Idle session timeout: 15 minutes. A connection that's been open but idle
# for 15min is closed. This is NEW in prod (dev leaves it off).
#
# Consequence for app services: connection pools must keepalive more
# frequently than 15min. HikariCP's default keepaliveTime is 0 (off), but
# its maxLifetime is 30min and minimumIdle keeps connections active. We'll
# configure HikariCP explicitly in Phase 1 to keepalive every 5 minutes.
idle_session_timeout = '900s'

# ==============================================================================
# SECTION 9 — AUTOVACUUM (more aggressive for high-write workload)
# ------------------------------------------------------------------------------
# Prod tables accumulate dead tuples faster than dev. Tighter thresholds
# mean autovacuum runs more often and finishes faster.
# ==============================================================================

autovacuum = on
autovacuum_naptime = 30s

# Scale factors determine what fraction of a table's rows must be dead
# (vacuum) or changed (analyze) before autovacuum triggers. Lower = more
# frequent. Dev defaults are 0.2 / 0.1; prod halves them.
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05

# Absolute thresholds: even tiny tables get vacuumed after this many dead
# rows. Prevents small high-churn tables from being starved.
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50

# Cost-based throttling. Higher cost_limit = autovacuum does more work per
# cycle. Lower cost_delay = less sleep between work units. Together they
# make autovacuum more aggressive.
autovacuum_vacuum_cost_limit = 1000
autovacuum_vacuum_cost_delay = 1ms

# Workers. Dev is 3; prod is 4 to allow parallel vacuuming of hot tables.
autovacuum_max_workers = 4

# Vacuum insert-only tables more aggressively. Applies to tables where rows
# are never updated (append-only). Phase 5's notifications.delivery_log and
# payments.payment_event are candidates; can also be set per-table.
# autovacuum_vacuum_insert_scale_factor = 0.1
# autovacuum_vacuum_insert_threshold = 1000

# ==============================================================================
# SECTION 10 — CLIENT CONNECTION DEFAULTS
# ------------------------------------------------------------------------------
# Same as dev — these are semantic defaults, not performance settings.
# ==============================================================================

timezone = 'UTC'
datestyle = 'ISO, MDY'
default_text_search_config = 'pg_catalog.english'

# ==============================================================================
# SECTION 11 — BACKGROUND WRITER (unchanged from dev)
# ==============================================================================
# Defaults are well-tuned. bgwriter flushes dirty pages from shared_buffers
# in the background so foreground queries don't have to.
# bgwriter_delay = 200ms              # default
# bgwriter_lru_maxpages = 100         # default
# bgwriter_lru_multiplier = 2.0       # default

# ==============================================================================
# SECTION 12 — ASYNC I/O (Linux io_uring when available)
# ------------------------------------------------------------------------------
# Postgres 16 supports io_uring for async I/O. Kernel 5.1+ required.
# `worker` (default) is universally compatible.
#
# If your host supports io_uring and you want the small perf gain, set:
#   io_method = 'io_uring'
#   io_workers = 8
#
# We leave it default for maximum compatibility. Switch after verifying
# kernel support and Postgres build flags.
# ==============================================================================

# io_method = 'worker'   # default
# io_workers = 3         # default

# ==============================================================================
# SECTION 13 — JIT (leave defaults)
# ==============================================================================
# JIT compilation helps large analytical queries and hurts short OLTP
# queries. Default cost thresholds only trigger JIT for expensive plans.
# Leave default. If reporting queries prove JIT-beneficial, tune thresholds
# per-role (reporting_svc can have lower thresholds).
# ==============================================================================

# jit = on                     # default
# jit_above_cost = 100000      # default
# jit_inline_above_cost = 500000    # default
# jit_optimize_above_cost = 500000  # default

# ==============================================================================
# SECTION 14 — SECURITY
# ------------------------------------------------------------------------------
# Postgres is not directly exposed to the internet. It's reachable only on
# the `data` Docker network (File 2a/2b). TLS between clients and Postgres
# is therefore deferred.
#
# If a future deployment needs TLS (e.g., cross-host), uncomment:
#   ssl = on
#   ssl_cert_file = '/etc/postgresql/server.crt'
#   ssl_key_file  = '/etc/postgresql/server.key'
#   ssl_min_protocol_version = 'TLSv1.3'
#
# Password encryption is already enforced via pg_hba.conf (image default):
# all non-local connections require md5 or scram-sha-256 passwords.
# ==============================================================================

# ==============================================================================
# SECTION 15 — EXTENSION SETTINGS
# ==============================================================================
# pg_cron would be added here in Phase 7. When uncommented, also add 'pg_cron'
# to shared_preload_libraries above:
#   shared_preload_libraries = 'pg_stat_statements,pg_cron'
#   cron.database_name = 'omp'
#   cron.timezone = 'UTC'
#   cron.log_statement = on
# ==============================================================================

# ==============================================================================
# SUMMARY OF DIFFERENCES FROM DEV (postgresql.conf)
# ------------------------------------------------------------------------------
# Every value below differs from dev. Everything else is identical.
#
#   max_connections                             100 → 200
#   superuser_reserved_connections                3 → 5
#   shared_buffers                            256MB → 4GB
#   work_mem                                    8MB → 24MB
#   maintenance_work_mem                       64MB → 512MB
#   effective_cache_size                        1GB → 12GB
#   archive_mode                                 off → on
#   archive_command                        (none) → pgbackrest archive-push
#   archive_timeout                        (none) → 300s
#   max_wal_size                                1GB → 4GB
#   min_wal_size                               80MB → 1GB
#   wal_buffers                          (auto) → 64MB
#   checkpoint_timeout                         5min → 15min
#   max_wal_senders                               0 → 5
#   max_replication_slots                         0 → 5
#   max_slot_wal_keep_size                 (none) → 10GB
#   random_page_cost                            4.0 → 1.1
#   effective_io_concurrency                      1 → 200
#   log_destination                         'stderr' → 'jsonlog'
#   log_line_prefix                '%m [%p]...' → (unused, jsonlog)
#   log_min_duration_statement                   -1 → 1000
#   log_autovacuum_min_duration                   0 → 1000
#   log_temp_files                               -1 → 0
#   log_lock_waits                              off → on
#   log_replication_commands                    off → on
#   statement_timeout                          60s → 30s
#   lock_timeout                               10s → 5s
#   idle_in_transaction_session_timeout       120s → 60s
#   idle_session_timeout                    (off) → 900s
#   autovacuum_naptime                         1min → 30s
#   autovacuum_vacuum_scale_factor              0.2 → 0.1
#   autovacuum_analyze_scale_factor             0.1 → 0.05
#   autovacuum_vacuum_cost_limit                200 → 1000
#   autovacuum_vacuum_cost_delay                2ms → 1ms
#   autovacuum_max_workers                        3 → 4
#
# ==============================================================================
# END OF postgresql.prod.conf
# ==============================================================================