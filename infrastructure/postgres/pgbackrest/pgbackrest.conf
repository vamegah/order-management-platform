# ==============================================================================
# Order Management Platform — pgBackRest Configuration
# ------------------------------------------------------------------------------
# FILENAME : infrastructure/postgres/pgbackrest/pgbackrest.conf
# MOUNTED  : /etc/pgbackrest/pgbackrest.conf (read-only) into BOTH:
#              - the `postgres` container (File 2b amended)
#              - the `pgbackrest` sidecar container (File 2b)
#
# WHY THIS FILE EXISTS
#   pgBackRest needs to know:
#     - Where its repository is (on the shared volume)
#     - What stanza to use (one stanza: `omp`)
#     - How to reach Postgres (host, port, user, data path)
#     - How to encrypt backups (cipher type + passphrase source)
#     - What retention policy to enforce
#     - How much to compress
#
#   Both containers read this file. The Postgres container invokes
#   `pgbackrest archive-push` for each WAL segment. The sidecar invokes
#   `pgbackrest backup`, `expire`, `check`, `info`. Same config, different
#   commands.
#
# CRITICAL DEPENDENCIES
#   - File 9's postgresql.prod.conf: archive_mode=on and archive_command.
#   - File 9a's Dockerfile: pgbackrest binary + /etc/pgbackrest dir.
#   - File 2b's overlay: mounts this file into both containers.
#   - File 10a's entrypoint.sh: drives the sidecar's schedule.
#   - The shared volume pgbackrest-data: mounted at /var/lib/pgbackrest in
#     both containers.
#
# ENCRYPTION PASSPHRASE
#   pgBackRest does NOT read the cipher passphrase from a file directly.
#   We pass it via a wrapper script that reads /run/secrets/pgbackrest_repo_cipher
#   and injects it as `--repo1-cipher-pass=...` on the command line:
#     - Postgres: /usr/local/bin/pgbackrest-archive-push (added by File 9a-amend)
#     - Sidecar:  /entrypoint.sh (File 10a)
#
#   The passphrase is NEVER in this file. This file is committed to git.
#
# STANZA NAME
#   `omp` — matches the entire cluster for this platform. If we ever split
#   into multiple Postgres clusters (e.g., a dedicated analytics cluster),
#   each would get its own stanza, and this file would have multiple
#   [stanza] sections.
#
# REFERENCE
#   Full pgBackRest configuration reference:
#     https://pgbackrest.org/configuration.html
#
# ==============================================================================

# ==============================================================================
# [global] — applies to every command, both containers
# ==============================================================================

[global]

# ------------------------------------------------------------------------------
# Repository — location and identity
# ------------------------------------------------------------------------------
# Both containers mount the shared volume at this exact path. The Postgres
# container writes WAL segments here via archive-push; the sidecar reads
# them for backups.
#
# This path is INSIDE the container, not on the host. The host path is
# managed by Docker (see File 2b: pgbackrest-data volume).
repo1-path=/var/lib/pgbackrest

# Repository type: posix filesystem. Alternatives: s3, azure, gcs, sftp.
# We use local filesystem because everything runs on one host. To add cloud
# redundancy later, define `repo2-*` and pgBackRest will write to both.
repo1-type=posix

# Retention policy for full backups — keep 14 of them.
# Retention is enforced by `pgbackrest expire`, which the sidecar runs on
# schedule (see File 10a).
repo1-retention-full=14

# Retention policy for WAL archives — keep 30 days.
# WAL is required to fill the gap between the most recent full backup and
# any point in time. Retention must cover at least the age of the oldest
# full backup you might restore from.
repo1-retention-archive=30
repo1-retention-archive-type=time

# ------------------------------------------------------------------------------
# Repository encryption
# ------------------------------------------------------------------------------
# AES-256-CBC encryption for every file in the repository. Even if someone
# steals the repository volume or an individual backup file, they cannot
# read it without the passphrase.
#
# The passphrase comes from /run/secrets/pgbackrest_repo_cipher, injected
# on the command line by wrapper scripts. See the "ENCRYPTION PASSPHRASE"
# note at the top of this file.
#
# WHY CIPHER OVER FILESYSTEM ENCRYPTION
#   Filesystem encryption (LUKS, EBS) protects the volume when the host
#   is off. pgBackRest's cipher protects the repository even when the host
#   is on — for example, if another container is compromised and can read
#   the shared volume. Defense in depth.
repo1-cipher-type=aes-256-cbc

# We do NOT set repo1-cipher-pass here. It's injected by the wrapper scripts.

# ------------------------------------------------------------------------------
# Compression
# ------------------------------------------------------------------------------
# Zstandard. Best ratio/speed trade-off for Postgres backups.
# Alternatives: none, gzip, lz4, bz2. See the design notes above.
compress-type=zst

# Compression level (1-22 for zst). 3 is the default and a good balance.
# Higher levels use more CPU for marginal size reduction. Only increase if
# storage is the constraint and CPU is plentiful.
compress-level=3

# Compress WAL segments on archive-push. WAL is already dense, but zst still
# typically saves 40-50%.
compress-level-network=3

# ------------------------------------------------------------------------------
# Logging
# ------------------------------------------------------------------------------
# Console (stderr) logging goes to Docker's log driver, then to Loki (Phase 7).
# We disable file logging entirely — no persistent log volume for the sidecar,
# and Docker captures everything anyway.
#
# log-level-console is a "default" — the wrapper scripts override it per
# invocation:
#   - Postgres's archive_command wrapper: --log-level-console=warn (quiet)
#   - Sidecar's scheduled jobs:           --log-level-console=info
log-level-console=info
log-level-stderr=off
log-level-file=off

# Timestamp format in logs. ISO 8601 in UTC — parseable by Loki.
log-timestamp=y

# ------------------------------------------------------------------------------
# Process behaviour
# ------------------------------------------------------------------------------
# Delta option: use checksums to skip unchanged files during backups.
# Trades CPU for I/O. Our data is on NVMe (fast I/O), so this is a modest
# benefit — but it also reduces wear on SSDs by not reading unchanged files.
delta=y

# Process count for parallel compression during backup. Higher = faster
# backup but more CPU. 2 is a good default for our reference host (8 cores).
# Scale to 4+ on hosts with more cores.
process-max=2

# Number of files to buffer in memory. Auto-tuned by default; we set
# explicitly for predictability. Higher = fewer I/O stalls, more memory.
# buffer-size default is auto.
# buffer-size=1MiB

# ------------------------------------------------------------------------------
# Stanza defaults (can be overridden per-stanza if we add more later)
# ------------------------------------------------------------------------------
# Timeout for local/remote operations. 30 minutes is generous but safe;
# our backups should complete in under 5 minutes on NVMe.
io-timeout=1800

# Protocol timeout for remote operations. Not used in our topology
# (everything is local), but set for completeness.
protocol-timeout=1830

# ------------------------------------------------------------------------------
# File permission verification
# ------------------------------------------------------------------------------
# pgBackRest verifies that the repository and data directories have
# appropriate permissions before operating. If permissions are wrong,
# backup fails loudly rather than producing an insecure repository.
# Keep defaults (verification on).

# ------------------------------------------------------------------------------
# Postgres connection (from the sidecar container)
# ------------------------------------------------------------------------------
# pg1-host is the Docker service name of the Postgres container. pgBackRest
# resolves it via Docker's internal DNS.
#
# pg1-path is the path to the data directory AS SEEN INSIDE THE POSTGRES
# CONTAINER. The sidecar mounts the same volume at the same path (File 2b),
# so this path is valid in both contexts.
#
# pg1-user is the superuser. Backups require reading the WAL and calling
# pg_backup_start/pg_backup_stop, which need elevated privileges.
#
# The password is NOT set here. It's provided at runtime via PGPASSWORD
# (see the sidecar's entrypoint.sh, File 10a).
pg1-host=postgres
pg1-host-type=tcp
pg1-port=5432
pg1-user=omp_admin
pg1-path=/var/lib/postgresql/data

# pg1-database — the database pgBackRest connects to for control operations
# (pg_backup_start, pg_backup_stop, etc.). It can be any database the user
# can connect to. We use `postgres` (the maintenance database created by
# the Docker image by default), not our application's `omp` database.
pg1-database=postgres

# ------------------------------------------------------------------------------
# TLS to Postgres
# ------------------------------------------------------------------------------
# We do NOT use TLS for the pgBackRest → Postgres connection. Both are on
# the internal `data` Docker network (File 2a), which is not reachable from
# outside the host. TLS would add certificate management for no security
# benefit in this topology.
#
# If we ever move Postgres to a remote host, add:
#   pg1-host-ca-file=/etc/pgbackrest/ca.pem
#   pg1-host-cert-file=/etc/pgbackrest/client.crt
#   pg1-host-key-file=/etc/pgbackrest/client.key
#   pg1-host-type=tls

# ==============================================================================
# [global:archive-push] — tuning for the Postgres-side WAL archiving path
# ------------------------------------------------------------------------------
# These settings apply specifically when Postgres invokes `pgbackrest
# archive-push` for each WAL segment. They're tuned for "fast, quiet,
# many small invocations."
# ==============================================================================

[global:archive-push]

# Use async archiving. The archive-push command returns success as soon as
# the WAL segment is queued, not when it's fully uploaded. Postgres marks
# the segment as archived and moves on. A separate pgBackRest process
# completes the upload in the background.
#
# TRADE-OFF: if the host crashes after archive-push returns but before the
# upload completes, that WAL segment is lost from the archive. In practice,
# the window is tiny (milliseconds to seconds). This is the standard
# production configuration.
#
# For strict synchronous archiving (no window), set queue-max=0. Postgres
# then waits for the full upload before marking the segment archived. This
# increases commit latency during WAL switches.
archive-async=y

# Maximum size of the async archive queue. When full, archive-push falls
# back to synchronous mode. 4GB is generous; combined with the typical WAL
# segment size of 16MB, this holds ~256 pending segments.
archive-async-queue-max=4GB

# ==============================================================================
# [global:archive-get] — tuning for recovery (fetching WAL from archive)
# ------------------------------------------------------------------------------
# Used during point-in-time recovery (PITR). Reads archived WAL segments
# back into pg_wal so Postgres can replay them. We don't run PITR in normal
# operation, but the settings matter when we do.
# ==============================================================================

[global:archive-get]

# Async reads during recovery. Same reasoning as archive-push.
archive-async=y

# Queue size for async reads. Larger = more parallel WAL fetches during
# recovery, faster replay. 4GB mirrors the push setting.
archive-async-queue-max=4GB

# ==============================================================================
# [omp] — the stanza definition for our Postgres cluster
# ------------------------------------------------------------------------------
# A stanza is a named backup target. One stanza per Postgres cluster.
# The stanza name `omp` matches:
#   - File 9's archive_command:      --stanza=omp
#   - File 10a's scheduled commands: --stanza=omp
#   - This file's section header
# ==============================================================================

[omp]

# ------------------------------------------------------------------------------
# Backup retention (stanza-level overrides for [global])
# ------------------------------------------------------------------------------
# These override the [global] values for this stanza specifically. Since we
# only have one stanza, the values match — but declaring them at the stanza
# level makes the intent explicit and provides a template if we add a second
# cluster later.
repo1-retention-full=14
repo1-retention-archive=30
repo1-retention-archive-type=time

# ------------------------------------------------------------------------------
# Backup type defaults
# ------------------------------------------------------------------------------
# The sidecar's schedule (File 10a) explicitly passes --type=full or
# --type=incr, so this default is only used if someone runs `pgbackrest
# backup` without --type. `incr` is the safe default (smallest, fastest).
backup-type=incr

# ------------------------------------------------------------------------------
# WAL archive settings
# ------------------------------------------------------------------------------
# Archive-check: verify that each WAL segment required for consistency has
# been archived before allowing the backup to complete. This is critical —
# without it, a backup could complete while WAL is still pending, and a
# restore would be inconsistent.
archive-check=y

# Archive-copy: copy the WAL segments required for a backup INTO the backup
# itself. This makes each full backup self-contained — you can restore it
# without needing the WAL archive up to that point.
#
# TRADE-OFF: increases backup size by the WAL volume (typically 10-30% for
# an active database). But it means a full backup can be restored without
# any other files.
archive-copy=y

# ------------------------------------------------------------------------------
# Backup verification
# ------------------------------------------------------------------------------
# Run checksum verification on the backup after it completes. Catches
# corruption from disk errors or transfer issues. Adds a few minutes to
# each backup but is worth it.
# Default: y in recent pgBackRest. Declared explicitly.
backup-standby=n
# (We don't have a standby to offload backups to. If we add a read replica
# later, set this to y and point pg1-host at the standby.)

# ------------------------------------------------------------------------------
# Backup labeling
# ------------------------------------------------------------------------------
# Human-readable annotation attached to each backup. Useful in `pgbackrest
# info` output and in monitoring. Phase 7 will parse these.
# e.g., `pgbackrest --annotation=environment=prod backup`
# Set per-invocation by the sidecar entrypoint (File 10a).

# ==============================================================================
# NOTES ON OPERATIONAL PROCEDURES
# ==============================================================================
#
# FIRST-TIME SETUP (one-time, manual)
#   After the Postgres container is up and healthy, and BEFORE the sidecar
#   container starts, run:
#     docker compose ... exec postgres \
#       pgbackrest --stanza=omp --repo=1 \
#                  --repo1-cipher-pass="$(cat /run/secrets/pgbackrest_repo_cipher)" \
#                  stanza-create
#
#   This creates the repository directory structure for the `omp` stanza.
#   Without this step, all backup and archive commands fail with
#   "stanza not initialized."
#
#   See File 22's runbook for the full first-deploy procedure.
#
# VERIFY STANZA
#     docker compose ... exec pgbackrest pgbackrest --stanza=omp check
#   Should print "stanza: ok" and exit 0.
#
# TAKE A MANUAL BACKUP
#     docker compose ... exec pgbackrest \
#       pgbackrest --stanza=omp --repo=1 --type=full \
#                  --repo1-cipher-pass="$(cat /run/secrets/pgbackrest_repo_cipher)" \
#                  backup
#
# LIST BACKUPS
#     docker compose ... exec pgbackrest \
#       pgbackrest --stanza=omp --repo=1 info
#
# RESTORE (PITR to a specific timestamp)
#   Full procedure in File 22's runbook. Summary:
#     pgbackrest --stanza=omp --repo=1 \
#                --repo1-cipher-pass="$(cat /run/secrets/pgbackrest_repo_cipher)" \
#                --type=time --target='2024-11-15 14:30:00+00' \
#                restore
#
# ==============================================================================
# END OF pgbackrest.conf
# ==============================================================================