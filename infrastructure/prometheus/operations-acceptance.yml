global:
  scrape_interval: 1s
  evaluation_interval: 1s
  external_labels:
    env: acceptance
rule_files:
- /etc/prometheus/rules/application.yml
alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - alertmanager:9093
scrape_configs:
- job_name: controlled
  static_configs:
  - targets:
    - alert-receiver:8080
