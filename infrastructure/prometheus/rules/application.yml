# 30-day objectives: availability 99.9%; 99% of successful HTTP requests <= 1s.
groups:
- name: omp-slos
  interval: 15s
  rules:
  - record: omp:http_error_ratio:5m
    expr: sum by (service) (rate(http_server_requests_seconds_count{status=~"5..",uri!~"/actuator.*"}[5m]))
      / clamp_min(sum by (service) (rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[5m])),
      0.001)
  - record: omp:http_slow_ratio:5m
    expr: 1 - (sum by (service) (rate(http_server_requests_seconds_bucket{le="1.0",uri!~"/actuator.*"}[5m]))
      / clamp_min(sum by (service) (rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[5m])),
      0.001))
  - record: omp:http_error_ratio:30m
    expr: sum by (service) (rate(http_server_requests_seconds_count{status=~"5..",uri!~"/actuator.*"}[30m]))
      / clamp_min(sum by (service) (rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[30m])),
      0.001)
  - record: omp:http_slow_ratio:30m
    expr: 1 - (sum by (service) (rate(http_server_requests_seconds_bucket{le="1.0",uri!~"/actuator.*"}[30m]))
      / clamp_min(sum by (service) (rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[30m])),
      0.001))
  - record: omp:http_error_ratio:1h
    expr: sum by (service) (rate(http_server_requests_seconds_count{status=~"5..",uri!~"/actuator.*"}[1h]))
      / clamp_min(sum by (service) (rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[1h])),
      0.001)
  - record: omp:http_slow_ratio:1h
    expr: 1 - (sum by (service) (rate(http_server_requests_seconds_bucket{le="1.0",uri!~"/actuator.*"}[1h]))
      / clamp_min(sum by (service) (rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[1h])),
      0.001))
  - record: omp:http_error_ratio:6h
    expr: sum by (service) (rate(http_server_requests_seconds_count{status=~"5..",uri!~"/actuator.*"}[6h]))
      / clamp_min(sum by (service) (rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[6h])),
      0.001)
  - record: omp:http_slow_ratio:6h
    expr: 1 - (sum by (service) (rate(http_server_requests_seconds_bucket{le="1.0",uri!~"/actuator.*"}[6h]))
      / clamp_min(sum by (service) (rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[6h])),
      0.001))
  - alert: ServiceDown
    expr: up{tier="app"} == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: Application cannot be scraped
      runbook_url: https://github.com/vamegah/order-management-platform/blob/main/docs/runbooks/operations.md#servicedown
  - alert: AvailabilityBudgetFastBurn
    expr: omp:http_error_ratio:5m / 0.001 > 14.4 and on(service) omp:http_error_ratio:1h
      / 0.001 > 14.4
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: Availability budget burning above 14.4x
      runbook_url: https://github.com/vamegah/order-management-platform/blob/main/docs/runbooks/operations.md#availabilitybudgetfastburn
  - alert: AvailabilityBudgetSlowBurn
    expr: omp:http_error_ratio:30m / 0.001 > 6 and on(service) omp:http_error_ratio:6h
      / 0.001 > 6
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Availability budget burning above 6x
      runbook_url: https://github.com/vamegah/order-management-platform/blob/main/docs/runbooks/operations.md#availabilitybudgetslowburn
  - alert: LatencyBudgetFastBurn
    expr: omp:http_slow_ratio:5m / 0.01 > 14.4 and on(service) omp:http_slow_ratio:1h
      / 0.01 > 14.4
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: Latency budget burning above 14.4x
      runbook_url: https://github.com/vamegah/order-management-platform/blob/main/docs/runbooks/operations.md#latencybudgetfastburn
  - alert: JvmHeapSaturation
    expr: sum by(service) (jvm_memory_used_bytes{area="heap"}) / sum by(service) (jvm_memory_max_bytes{area="heap"})
      > 0.85
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: JVM heap saturation
      runbook_url: https://github.com/vamegah/order-management-platform/blob/main/docs/runbooks/operations.md#jvmheapsaturation
  - alert: DatabasePoolSaturation
    expr: hikaricp_connections_active / hikaricp_connections_max > 0.9
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Database connection pool saturation
      runbook_url: https://github.com/vamegah/order-management-platform/blob/main/docs/runbooks/operations.md#databasepoolsaturation
  - alert: RedisBlockedClients
    expr: redis_blocked_clients > 5
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: Redis clients blocked
      runbook_url: https://github.com/vamegah/order-management-platform/blob/main/docs/runbooks/operations.md#redisblockedclients
  - alert: KafkaConsumerLagHigh
    expr: sum by(consumergroup,topic) (kafka_consumergroup_lag) > 1000
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Kafka consumer backlog
      runbook_url: https://github.com/vamegah/order-management-platform/blob/main/docs/runbooks/operations.md#kafkaconsumerlaghigh
  - alert: OutboxLagHigh
    expr: outbox_oldest_pending_seconds > 120
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Durable outbox age exceeds recovery objective
      runbook_url: https://github.com/vamegah/order-management-platform/blob/main/docs/runbooks/operations.md#outboxlaghigh
  - alert: WebhookDlqNonEmpty
    expr: omp_queue_pending{queue="webhook_dlq"} > 0
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Webhook DLQ requires authorized replay
      runbook_url: https://github.com/vamegah/order-management-platform/blob/main/docs/runbooks/operations.md#webhookdlqnonempty
  - alert: TlsCertificateExpiryCritical
    expr: (omp_tls_certificate_not_after_seconds - time() < 604800) or (traefik_tls_certs_not_after - time() < 604800)
    for: 0s
    labels:
      severity: critical
    annotations:
      summary: Certificate expires within seven days
      runbook_url: https://github.com/vamegah/order-management-platform/blob/main/docs/runbooks/operations.md#tlscertificateexpirycritical
  - alert: TelemetryExportFailures
    expr: rate(otelcol_exporter_send_failed_spans_total[5m]) > 0
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Trace export dropping spans
      runbook_url: https://github.com/vamegah/order-management-platform/blob/main/docs/runbooks/operations.md#telemetryexportfailures
