// ==============================================================================
// Inventory Service — gRPC API
// ------------------------------------------------------------------------------
// Defines the gRPC service for stock levels, reservations, and warehouse
// operations. Called by order-service (for availability checks and
// reservations) and by other internal services.
//
// DESIGN NOTES
//   - All IDs are UUIDs (as strings).
//   - Quantities are int32; large quantities are rare and would fit in int64
//     if needed later.
//   - All methods require authentication via JWT in gRPC metadata
//     (Authorization: Bearer <jwt>). This is enforced by an interceptor.
//   - Errors use standard gRPC status codes. See "ERROR MODEL" below.
//
// ERROR MODEL
//   INVALID_ARGUMENT     — bad input (negative quantity, malformed ID)
//   NOT_FOUND            — SKU or reservation does not exist
//   ALREADY_EXISTS       — reservation already exists for this order+SKU
//   FAILED_PRECONDITION  — insufficient stock, or a state transition that
//                          is illegal (e.g., commit a released reservation)
//   PERMISSION_DENIED    — authenticated but not authorized
//   UNAUTHENTICATED      — missing or invalid JWT
//   UNAVAILABLE          — dependency down
//   DEADLINE_EXCEEDED    — timeout
//
// VERSIONING
//   This package is `omp.inventory` (v1). Breaking changes go in a new
//   package, `omp.inventory.v2`, and a new service name
//   `omp.inventory.v2.InventoryService`.
// ==============================================================================

syntax = "proto3";

package omp.inventory;

option java_package = "com.example.omp.proto.inventory";
option java_multiple_files = true;
option java_outer_classname = "InventoryProto";

// ==============================================================================
// Service definition
// ==============================================================================

service InventoryService {

  // ---------------------------------------------------------------------------
  // Stock queries (unary)
  // ---------------------------------------------------------------------------

  // Gets the current stock level for a SKU in a specific warehouse.
  rpc GetStockLevel(GetStockLevelRequest) returns (StockLevel);

  // Checks if N units are available for a SKU in a specific warehouse.
  // Called by order-service before placing an order.
  rpc CheckAvailability(CheckAvailabilityRequest) returns (CheckAvailabilityResponse);

  // ---------------------------------------------------------------------------
  // Reservations (unary)
  // ---------------------------------------------------------------------------

  // Reserves N units for an order. Fails if insufficient stock.
  rpc ReserveStock(ReserveStockRequest) returns (Reservation);

  // Releases a reservation (typically on order cancellation).
  rpc ReleaseReservation(ReleaseReservationRequest) returns (Reservation);

  // Commits a reservation, converting it to a permanent stock decrement
  // (typically on order shipment).
  rpc CommitReservation(CommitReservationRequest) returns (Reservation);

  // Fetches a reservation by ID.
  rpc GetReservation(GetReservationRequest) returns (Reservation);

  // Privileged recovery lookup; requires order.reconcile scope.
  rpc FindReservationsByOrder(FindReservationsByOrderRequest) returns (FindReservationsByOrderResponse);

  // Privileged durable cancellation fence. Releases active holds and restores
  // committed stock exactly once; rejects future reserve/commit for this order.
  rpc CompensateOrder(CompensateOrderRequest) returns (FindReservationsByOrderResponse);

  // ---------------------------------------------------------------------------
  // Bulk operations (client streaming)
  // ---------------------------------------------------------------------------

  // Reserves multiple SKUs for a single order in one streaming call.
  // The client sends one BulkReserveItem at a time; the server sends a
  // single BulkReserveResponse when the stream ends.
  //
  // Use case: an order with 20 lines that all need reserving can be sent
  // as one stream rather than 20 unary calls.
  rpc BulkReserve(stream BulkReserveItem) returns (BulkReserveResponse);

  // ---------------------------------------------------------------------------
  // Real-time updates (server streaming)
  // ---------------------------------------------------------------------------

  // Streams stock updates for a set of SKUs. The server pushes a
  // StockUpdate every time stock changes for any of the subscribed SKUs.
  //
  // Use case: the notification-service subscribes to low-stock alerts.
  //
  // The stream is closed by the client or by a server-side timeout
  // (see config).
  rpc StreamStockUpdates(StreamStockUpdatesRequest) returns (stream StockUpdate);
}

// ==============================================================================
// Messages — stock queries
// ==============================================================================

message GetStockLevelRequest {
  // SKU to query.
  string sku = 1;
  // Warehouse ID. If empty, aggregates across all warehouses.
  string warehouse_id = 2;
}

message StockLevel {
  string sku = 1;
  string warehouse_id = 2;
  // Total units physically in the warehouse.
  int32 quantity_on_hand = 3;
  // Units currently reserved for pending orders.
  int32 quantity_reserved = 4;
  // Units available for new reservations.
  // Computed as quantity_on_hand - quantity_reserved.
  int32 quantity_available = 5;
  // When this stock level was last updated.
  int64 last_updated_epoch_millis = 6;
}

message CheckAvailabilityRequest {
  string sku = 1;
  string warehouse_id = 2;
  int32 requested_quantity = 3;
}

message CheckAvailabilityResponse {
  bool available = 1;
  // Current available quantity. Useful for the caller to decide whether to
  // reduce the requested quantity or fail the order.
  int32 available_quantity = 2;
}

// ==============================================================================
// Messages — reservations
// ==============================================================================

message ReserveStockRequest {
  string sku = 1;
  string warehouse_id = 2;
  int32 quantity = 3;
  // The order that this reservation belongs to. Used for idempotency:
  // reserving the same (order_id, sku) twice returns the existing
  // reservation rather than creating a duplicate.
  string order_id = 4;
}

message Reservation {
  string id = 1;
  string sku = 2;
  string warehouse_id = 3;
  int32 quantity = 4;
  string order_id = 5;
  ReservationStatus status = 6;
  int64 created_at_epoch_millis = 7;
  int64 updated_at_epoch_millis = 8;
}

enum ReservationStatus {
  RESERVATION_STATUS_UNSPECIFIED = 0;
  // Stock is held; can still be released or committed.
  RESERVATION_STATUS_ACTIVE = 1;
  // Converted to a permanent decrement. Terminal.
  RESERVATION_STATUS_COMMITTED = 2;
  // Released back to available stock. Terminal.
  RESERVATION_STATUS_RELEASED = 3;
  // Expired without commit or release (system-cleaned). Terminal.
  RESERVATION_STATUS_EXPIRED = 4;
  RESERVATION_STATUS_RESTOCKED = 5;
}

message ReleaseReservationRequest {
  string reservation_id = 1;
  // Optional reason, recorded in the reservation history.
  string reason = 2;
}

message CommitReservationRequest {
  string reservation_id = 1;
  string reason = 2;
}

message GetReservationRequest {
  string reservation_id = 1;
}

// ==============================================================================
// Messages — bulk operations
// ==============================================================================

message BulkReserveItem {
  string sku = 1;
  string warehouse_id = 2;
  int32 quantity = 3;
  // Required by the server for reservation ownership and idempotency.
  string order_id = 4;
}

message BulkReserveResponse {
  // One reservation per successfully reserved item.
  repeated Reservation reservations = 1;
  // Items that could not be reserved (e.g., insufficient stock).
  // Useful when the caller wants partial success.
  repeated FailedItem failures = 2;
}

message FailedItem {
  string sku = 1;
  int32 requested_quantity = 2;
  int32 available_quantity = 3;
  string reason = 4;
}

// ==============================================================================
// Messages — server-streaming updates
// ==============================================================================

message StreamStockUpdatesRequest {
  // SKUs to subscribe to. If empty, subscribes to all SKUs.
  repeated string skus = 1;
  string warehouse_id = 2;
}

message StockUpdate {
  string sku = 1;
  string warehouse_id = 2;
  int32 quantity_on_hand = 3;
  int32 quantity_reserved = 4;
  int32 quantity_available = 5;
  StockUpdateReason reason = 6;
  int64 occurred_at_epoch_millis = 7;
}

enum StockUpdateReason {
  STOCK_UPDATE_REASON_UNSPECIFIED = 0;
  STOCK_UPDATE_REASON_RESERVED = 1;
  STOCK_UPDATE_REASON_RELEASED = 2;
  STOCK_UPDATE_REASON_COMMITTED = 3;
  STOCK_UPDATE_REASON_RESTOCKED = 4;
  STOCK_UPDATE_REASON_ADJUSTMENT = 5;
}

message FindReservationsByOrderRequest { string order_id = 1; }
message FindReservationsByOrderResponse { repeated Reservation reservations = 1; }
message CompensateOrderRequest { string order_id = 1; string reason = 2; }
