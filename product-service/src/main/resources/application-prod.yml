# ==============================================================================
# Production overrides
# ==============================================================================
# Active when SPRING_PROFILES_ACTIVE=prod.
# ==============================================================================

logging:
  level:
    root: WARN
    com.example.omp: INFO
    org.flywaydb: INFO
    org.springframework.web: WARN
    org.hibernate: WARN

spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# OpenAPI spec is still generated (a static artifact for consumers) but the
# interactive UI is disabled in prod.
springdoc:
  swagger-ui:
    enabled: false

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}
  endpoint:
    health:
      show-details: when-authorized

app:
  cors:
    allowed-origins:
      - "https://web.${OMP_DOMAIN}"
      - "https://admin.${OMP_DOMAIN}"