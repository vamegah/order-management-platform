name: Signed immutable release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verified-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.source.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Require a verified main-branch source and protected release tag
        id: source
        env:
          # A read-only GitHub App token needs Administration/Actions/Contents read.
          # The default workflow token cannot read strict branch protection details.
          GH_TOKEN: ${{ secrets.RELEASE_POLICY_READ_TOKEN }}
        run: python scripts/check_release_source.py
  images:
    needs: verified-source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        service: [product-service, customer-service, order-service, graphql-gateway, inventory-service, payment-service, notification-service, legacy-banking-adapter, legacy-bank-service, postgres]
    env:
      SERVICE: ${{ matrix.service }}
      IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.service }}
      VERIFIED_RUN: ${{ needs.verified-source.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Select exact source and build context
        id: parameters
        run: |
          if [ "$SERVICE" = postgres ]; then
            echo 'context=infrastructure/postgres' >> "$GITHUB_OUTPUT"
            echo 'file=infrastructure/postgres/Dockerfile' >> "$GITHUB_OUTPUT"
          else
            echo 'context=.' >> "$GITHUB_OUTPUT"
            echo "file=$SERVICE/Dockerfile" >> "$GITHUB_OUTPUT"
          fi
          echo "epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p release
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: image
        with:
          context: ${{ steps.parameters.outputs.context }}
          file: ${{ steps.parameters.outputs.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          provenance: mode=max
          sbom: true
          build-args: SOURCE_DATE_EPOCH=${{ steps.parameters.outputs.epoch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Reject high and critical image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          cache-dir: ${{ runner.temp }}/omp-trivy-cache
          image-ref: ${{ env.IMAGE }}@${{ steps.image.outputs.digest }}
          format: json
          output: release/${{ matrix.service }}-scan.json
          exit-code: '1'
          severity: HIGH,CRITICAL
          scanners: vuln
          ignore-unfixed: false
      - name: Produce the exact image SBOM and build provenance
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          trivy image --format cyclonedx --scanners vuln --output "release/$SERVICE-sbom.json" "$IMAGE@$IMAGE_DIGEST"
          python scripts/build_release_bundle.py image --service "$SERVICE" --image "$IMAGE@$IMAGE_DIGEST" --output release
      - name: Install the signing tool from its reviewed image digest
        run: python scripts/install_cosign.py --directory "$RUNNER_TEMP/omp-cosign"
      - name: Sign image digest, SBOM and provenance with the workflow identity
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$IMAGE_DIGEST"
          cosign attest --yes --type cyclonedx --predicate "release/$SERVICE-sbom.json" "$IMAGE@$IMAGE_DIGEST"
          cosign attest --yes --type https://slsa.dev/provenance/v1 --predicate "release/$SERVICE-provenance.json" "$IMAGE@$IMAGE_DIGEST"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-${{ matrix.service }}
          path: release/**
          if-no-files-found: error
  bundle:
    needs: [verified-source, images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      packages: read
    env:
      VERIFIED_RUN: ${{ needs.verified-source.outputs.run }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Install the signing tool from its reviewed image digest
        run: python scripts/install_cosign.py --directory "$RUNNER_TEMP/omp-cosign"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Install the digest-pinned scanner
        shell: bash
        run: |
          set -euo pipefail
          image=$(python -c 'import json; print(json.load(open("infrastructure/release/images.lock.json"))["toolsAndBases"]["aquasec/trivy:0.76.2"])')
          tools="$RUNNER_TEMP/omp-release-tools"
          mkdir -p "$tools"
          container=$(docker create "$image")
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/usr/local/bin/trivy" "$tools/trivy"
          chmod 755 "$tools/trivy"
          echo "$tools" >> "$GITHUB_PATH"
      - name: Scan locked infrastructure and assemble the immutable release
        run: python scripts/build_release_bundle.py assemble --output release
      - name: Sign and verify the manifest before publishing
        run: |
          cosign sign-blob --yes --bundle release/release.sigstore.json release/release.json
          python scripts/release_policy.py verify --bundle release/release.json --signature release/release.sigstore.json --artifacts release --output release/compose.release.yml
      - name: Publish reviewed immutable release inputs
        run: gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --notes-file docs/runbooks/release.md --verify-tag
