name: Verify platform
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Cache the checksum-verified Maven distribution
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/wrapper/dists
          key: maven-wrapper-${{ runner.os }}-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test verification tooling
        run: python -m unittest discover -s scripts/tests -v
      - name: Verify Maven bootstrap without unzip and reject bad checksums
        run: bash scripts/tests/test_maven_wrapper.sh
      - name: Verify development certificate setup preserves existing identities
        run: bash scripts/tests/test_ci_setup.sh
      - name: Enforce production gRPC transport and stream topology
        env:
          OMP_DOMAIN: acceptance.example.invalid
          ACME_EMAIL: acceptance@example.invalid
          TRAEFIK_ADMIN_BASICAUTH: unused-for-config-validation
        run: |
          python scripts/check_production_configuration.py
          python scripts/check_security_inventory.py
      - name: Rebuild and verify the pinned GraphQL security backport
        run: python3 scripts/bootstrap_graphql_backport.py
      - name: Build and test reactor, including container integration tests
        run: bash mvnw --batch-mode --no-transfer-progress --fail-at-end clean verify
      - name: Reject missing, skipped or incomplete test and coverage evidence
        run: python scripts/check_verification.py
      - name: Publish test and coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/site/jacoco/**
          if-no-files-found: error

  packaged-payment-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Cache the checksum-verified Maven distribution
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/wrapper/dists
          key: maven-wrapper-${{ runner.os }}-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Package dependencies and run authenticated service containers
        run: >-
          bash mvnw --batch-mode --no-transfer-progress -pl platform-tests -am -Pe2e
          clean package failsafe:integration-test failsafe:verify
          -Dit.test=PaymentToWebhookContainerIT -Dfailsafe.failIfNoSpecifiedTests=false
      - name: Require executed container journey evidence
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suite = ET.parse('platform-tests/target/failsafe-reports/TEST-com.example.omp.tests.system.PaymentToWebhookContainerIT.xml').getroot()
          assert int(suite.get('tests', '0')) > 0, 'Container journey did not execute'
          for outcome in ('failures', 'errors', 'skipped'):
              assert int(suite.get(outcome, '0')) == 0, f'Container journey has {outcome}'
          PY
      - name: Publish packaged journey evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packaged-payment-journey-reports
          path: platform-tests/target/failsafe-reports/**
          if-no-files-found: error

  external-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_PROJECT_NAME: omp-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Define private development recovery identity paths
        shell: bash
        run: |
          printf 'ORDER_RECOVERY_TOKEN_DIRECTORY=%s/scheduled-recovery/projection\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'ORDER_RECOVERY_CLIENT_SECRET_FILE=%s/scheduled-recovery/client-secret\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Cache the checksum-verified Maven distribution
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/wrapper/dists
          key: maven-wrapper-${{ runner.os }}-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Prepare isolated development identities and local routing
        shell: bash
        run: |
          bash scripts/ci-setup.sh
          # The host tests own the keys; container UID/GID 1000 also needs read access.
          for service in order-service inventory-service payment-service; do
            sudo chgrp 1000 "infrastructure/tls/$service/tls.key"
            chmod 640 "infrastructure/tls/$service/tls.key"
          done
          echo '127.0.0.1 keycloak.localhost product-service.localhost customer-service.localhost order-service.localhost notification.localhost' | sudo tee -a /etc/hosts
      - name: Provision private development recovery identity for application UID 1000
        shell: bash
        run: |
          sudo --preserve-env=ORDER_RECOVERY_TOKEN_DIRECTORY,ORDER_RECOVERY_CLIENT_SECRET_FILE "$(command -v python)" - <<'PY'
          import json, os
          from pathlib import Path
          projection = Path(os.environ['ORDER_RECOVERY_TOKEN_DIRECTORY'])
          secret = Path(os.environ['ORDER_RECOVERY_CLIENT_SECRET_FILE'])
          assert projection.is_absolute() and secret.parent == projection.parent
          projection.parent.mkdir(mode=0o700)
          projection.mkdir(mode=0o700)
          realm = json.loads(Path('infrastructure/keycloak/import/omp-realm.json').read_text())
          credential = next(c['secret'] for c in realm['clients'] if c['clientId'] == 'order-recovery')
          with secret.open('x', encoding='utf-8') as target:
              os.fchmod(target.fileno(), 0o400)
              target.write(credential)
              os.fchown(target.fileno(), 1000, 1000)
          for path in (projection.parent, projection):
              os.chown(path, 1000, 1000)
          PY
      - name: Build the six deployed service images sequentially
        shell: bash
        run: |
          for service in product-service customer-service order-service inventory-service payment-service notification-service; do
            docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.e2e.yml build "$service"
          done
      - name: Start a fresh stack and require every health check
        run: >-
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.e2e.yml
          -f docker-compose.lifecycle.yml -f docker-compose.recovery-projector.yml
          up -d --no-build --wait --wait-timeout 600 traefik
          product-service customer-service order-service inventory-service payment-service notification-service
      - name: Exercise authenticated REST, mTLS gRPC and WebSocket journeys
        run: >-
          bash mvnw --batch-mode --no-transfer-progress
          -pl integration-tests -am -Pe2e verify
      - name: Reject missing or skipped external suites
        run: python scripts/check_verification.py --root integration-tests --include-e2e
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: clients/notifications/package-lock.json
      - name: Verify the packaged client against the deployed issuer and ownership policy
        working-directory: clients/notifications
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm run test:deployed 2>&1 | tee notification-client-deployed.log
      - name: Reject missing or skipped deployed client cases
        run: python scripts/check_junit.py clients/notifications/deployed-results.xml --minimum-tests 2
      - name: Deploy the supervised projector and enable isolated scheduled recovery
        run: >-
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.e2e.yml
          -f docker-compose.recovery.yml -f docker-compose.recovery-projector.yml
          -f docker-compose.recovery-acceptance.yml
          up -d --no-build --wait --wait-timeout 300 order-service
      - name: Verify automatic recovery across projection renewal and container failures
        env:
          E2E_RECOVERY_RESTARTS: 'true'
        run: >-
          bash mvnw --batch-mode --no-transfer-progress -pl integration-tests -am
          -Precovery-e2e verify
      - name: Require all ordinary and scheduled recovery acceptance suites
        run: |
          python scripts/check_junit.py integration-tests/target/failsafe-reports/TEST-com.example.omp.integration.ScheduledRecoveryIT.xml --minimum-tests 2
          python scripts/check_verification.py --root integration-tests --include-e2e --include-recovery-e2e
      - name: Enable short natural expiry only for isolated lifecycle acceptance
        run: >-
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.e2e.yml
          -f docker-compose.recovery.yml -f docker-compose.recovery-projector.yml
          -f docker-compose.recovery-acceptance.yml -f docker-compose.lifecycle-acceptance.yml
          up -d --no-build --wait --wait-timeout 300 order-service inventory-service
      - name: Verify accepted expiry, partial fulfillment compensation and shipment/refund races
        env:
          E2E_RECOVERY_RESTARTS: 'true'
        run: >-
          bash mvnw --batch-mode --no-transfer-progress -pl integration-tests -am
          -Plifecycle-e2e verify
      - name: Require every lifecycle and earlier deployed acceptance suite
        run: |
          python scripts/check_junit.py integration-tests/target/failsafe-reports/TEST-com.example.omp.integration.CoreLifecycleAcceptanceIT.xml --minimum-tests 4
          python scripts/check_verification.py --root integration-tests --include-e2e --include-recovery-e2e --include-lifecycle-e2e
      - name: Collect deployment diagnostics
        if: always()
        shell: bash
        run: |
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.e2e.yml -f docker-compose.recovery.yml -f docker-compose.recovery-projector.yml -f docker-compose.recovery-acceptance.yml ps -a > external-stack-status.log
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.e2e.yml -f docker-compose.recovery.yml -f docker-compose.recovery-projector.yml -f docker-compose.recovery-acceptance.yml logs --no-color > external-stack.log
      - name: Publish external acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: external-e2e-reports
          path: |
            integration-tests/target/failsafe-reports/**
            external-stack-status.log
            clients/notifications/notification-client-deployed.log
            clients/notifications/deployed-results.xml
            external-stack.log
          if-no-files-found: error
      - name: Remove only this run's isolated stack and volumes
        if: always()
        run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.e2e.yml -f docker-compose.recovery.yml -f docker-compose.recovery-projector.yml -f docker-compose.recovery-acceptance.yml down --volumes --remove-orphans

  grpc-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      E2E_GRPC_CONTROLS: 'true'
      E2E_GRPC_ISSUER_SUDO: 'true'
      GRPC_TLS_ENABLED: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Cache the checksum-verified Maven distribution
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/wrapper/dists
          key: maven-wrapper-${{ runner.os }}-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Prepare isolated issuer and production-profile workload identities
        shell: bash
        run: |
          echo "COMPOSE_PROJECT_NAME=omp-grpc-acceptance-$(openssl rand -hex 6)" >> "$GITHUB_ENV"
          issuer="$RUNNER_TEMP/grpc-issuer"
          echo "E2E_GRPC_ISSUER_DIRECTORY=$issuer" >> "$GITHUB_ENV"
          echo "GRPC_CA_CERT_FILE=$issuer/trust/ca.crt" >> "$GITHUB_ENV"
          echo "GRPC_CLIENT_CERT_FILE=$issuer/order-service/tls.crt" >> "$GITHUB_ENV"
          echo "GRPC_CLIENT_KEY_FILE=$issuer/order-service/tls.key" >> "$GITHUB_ENV"
          bash scripts/setup-grpc-acceptance.sh --output "$issuer"
          for service in order-service inventory-service payment-service; do
            sudo chgrp 1000 "$issuer/$service/tls.key"
            chmod 640 "$issuer/$service/tls.key"
          done
          echo '127.0.0.1 keycloak.localhost product-service.localhost customer-service.localhost order-service.localhost' | sudo tee -a /etc/hosts
      - name: Build the production-profile gRPC services and checkout prerequisites
        shell: bash
        run: |
          for service in product-service customer-service order-service inventory-service payment-service; do
            docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.e2e.yml build "$service"
          done
      - name: Start the isolated production-profile acceptance stack
        run: >-
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.e2e.yml
          -f docker-compose.grpc-e2e.yml up -d --no-build --wait --wait-timeout 600
          traefik kafka product-service customer-service order-service inventory-service payment-service
      - name: Exercise every RPC, all streaming patterns, replacement and uninterrupted renewal
        run: >-
          bash mvnw --batch-mode --no-transfer-progress -pl integration-tests -am -Pgrpc-e2e verify
      - name: Require complete executed gRPC acceptance evidence
        run: |
          python scripts/check_junit.py integration-tests/target/failsafe-reports/TEST-com.example.omp.integration.GrpcProductionIT.xml --minimum-tests 82
          python scripts/check_verification.py --root integration-tests --include-grpc-e2e
      - name: Collect gRPC workload diagnostics
        if: always()
        run: >-
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.e2e.yml
          -f docker-compose.grpc-e2e.yml logs --no-color > grpc-stack.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: grpc-production-acceptance
          path: |
            integration-tests/target/failsafe-reports/**
            integration-tests/target/grpc-acceptance-matrix.json
            grpc-stack.log
          if-no-files-found: error
      - name: Remove the disposable gRPC acceptance deployment
        if: always()
        run: >-
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.e2e.yml
          -f docker-compose.grpc-e2e.yml down --volumes --remove-orphans

  public-api-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_PROJECT_NAME: omp-public-api-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Define private development recovery identity paths
        shell: bash
        run: |
          printf 'ORDER_RECOVERY_TOKEN_DIRECTORY=%s/scheduled-recovery/projection\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'ORDER_RECOVERY_CLIENT_SECRET_FILE=%s/scheduled-recovery/client-secret\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Cache the checksum-verified Maven distribution
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/wrapper/dists
          key: maven-wrapper-${{ runner.os }}-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Prepare isolated development identities and local routing
        shell: bash
        run: |
          bash scripts/setup-public-api-acceptance.sh
          # The host tests own the keys; container UID/GID 1000 also needs read access.
          for service in order-service inventory-service payment-service; do
            sudo chgrp 1000 "infrastructure/tls/$service/tls.key"
            chmod 640 "infrastructure/tls/$service/tls.key"
          done
          sudo chgrp 1000 infrastructure/tls/legacy-bank-service/tls.p12
          chmod 640 infrastructure/tls/legacy-bank-service/tls.p12
          echo '127.0.0.1 keycloak.localhost product-service.localhost customer-service.localhost order-service.localhost notification.localhost payment-service.localhost banking.localhost graphql.localhost graphql-prod.localhost' | sudo tee -a /etc/hosts
      - name: Provision private development recovery identity for application UID 1000
        shell: bash
        run: |
          sudo --preserve-env=ORDER_RECOVERY_TOKEN_DIRECTORY,ORDER_RECOVERY_CLIENT_SECRET_FILE "$(command -v python)" - <<'PY'
          import json, os
          from pathlib import Path
          projection = Path(os.environ['ORDER_RECOVERY_TOKEN_DIRECTORY'])
          secret = Path(os.environ['ORDER_RECOVERY_CLIENT_SECRET_FILE'])
          assert projection.is_absolute() and secret.parent == projection.parent
          projection.parent.mkdir(mode=0o700)
          projection.mkdir(mode=0o700)
          realm = json.loads(Path('infrastructure/keycloak/import/omp-realm.json').read_text())
          credential = next(c['secret'] for c in realm['clients'] if c['clientId'] == 'order-recovery')
          with secret.open('x', encoding='utf-8') as target:
              os.fchmod(target.fileno(), 0o400)
              target.write(credential)
              os.fchown(target.fileno(), 1000, 1000)
          for path in (projection.parent, projection):
              os.chown(path, 1000, 1000)
          PY
      - name: Build the public API service images sequentially
        shell: bash
        run: |
          for service in product-service customer-service order-service inventory-service payment-service notification-service graphql-gateway legacy-banking-adapter legacy-bank-service; do
            docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.e2e.yml build "$service"
          done
      - name: Start a fresh stack and require every health check
        run: >-
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.e2e.yml
          -f docker-compose.lifecycle.yml -f docker-compose.recovery-projector.yml
          -f docker-compose.public-api-e2e.yml
          up -d --no-build --wait --wait-timeout 600 traefik
          product-service customer-service order-service inventory-service payment-service notification-service
          graphql-gateway graphql-gateway-prod legacy-banking-adapter
      - name: Install pinned public API contract tooling
        run: python -m pip install -r scripts/contracts-requirements.lock
      - name: Compare published HTTP contracts with the packaged implementations
        run: |
          python clients/public-api/export_live.py
          python scripts/check_api_contracts.py --live-root clients/public-api/build/live
      - name: Compile a consumer from published HTTP and GraphQL artifacts
        run: python clients/public-api/generate.py
      - name: Exercise authenticated public consumers through Traefik
        env:
          PUBLIC_API_E2E: '1'
        run: python clients/public-api/run_deployed.py
      - name: Require every public API acceptance case
        run: python scripts/check_junit.py clients/public-api/deployed-results.xml --minimum-tests 30
      - name: Collect public API diagnostics
        if: always()
        run: >-
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.e2e.yml
          -f docker-compose.lifecycle.yml -f docker-compose.recovery-projector.yml
          -f docker-compose.public-api-e2e.yml logs --no-color > public-api-stack.log
      - name: Publish public API contract and consumer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-api-contract-reports
          path: |
            clients/public-api/deployed-results.xml
            clients/public-api/build/**
            public-api-stack.log
          if-no-files-found: error
      - name: Remove only this public API project
        if: always()
        run: >-
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.e2e.yml
          -f docker-compose.lifecycle.yml -f docker-compose.recovery-projector.yml
          -f docker-compose.public-api-e2e.yml down --volumes --remove-orphans

  notification-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: clients/notifications
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: clients/notifications/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Reject missing or skipped client transport cases
        run: python ../../scripts/check_junit.py test-results.xml --minimum-tests 17
      - run: npm audit --audit-level=high
      - name: Generate client SBOM
        run: npm sbom --sbom-format cyclonedx --omit=dev > client-sbom.json
      - name: Package JavaScript and declarations
        run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: notification-client-package
          path: |
            ${{ runner.temp }}/omp-notifications-*.tgz
            clients/notifications/client-sbom.json
            clients/notifications/test-results.xml
          if-no-files-found: error

  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Cache the checksum-verified Maven distribution
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/wrapper/dists
          key: maven-wrapper-${{ runner.os }}-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Rebuild and verify the pinned GraphQL security backport
        run: python3 scripts/bootstrap_graphql_backport.py
      - name: Compile and enforce high-confidence SpotBugs findings
        run: bash mvnw --batch-mode --no-transfer-progress -Pstatic-analysis clean test-compile spotbugs:check
      - name: Reject incomplete analysis and missing classpaths
        run: python scripts/check_static_analysis.py
      - name: Publish static analysis reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: static-analysis-reports
          path: '**/target/spotbugsXml.xml'
          if-no-files-found: error

  contract-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Cache the checksum-verified Maven distribution
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/wrapper/dists
          key: maven-wrapper-${{ runner.os }}-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check out the exact PR base for contract comparison
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - name: Install public HTTP and GraphQL contract tooling
        run: python -m pip install -r scripts/contracts-requirements.lock
      - name: Verify published public APIs and compile current and prior consumers
        shell: bash
        run: |
          options=()
          if [ "${{ github.event_name }}" = pull_request ]; then
            options+=(--base-root baseline)
          fi
          python -m unittest discover -s scripts/contracts_tests -v
          python -m unittest discover -s clients/public-api/tests/unit -v
          python scripts/check_api_contracts.py "${options[@]}"
          python scripts/check_event_contracts.py "${options[@]}"
          python clients/public-api/generate.py "${options[@]}"
      - name: Generate and verify base protobuf clients and descriptors
        if: github.event_name == 'pull_request'
        working-directory: baseline
        run: bash mvnw --batch-mode --no-transfer-progress -pl shared/proto -am clean verify
      - name: Verify published protobuf contracts and the exact PR base
        shell: bash
        run: |
          options=()
          if [ "${{ github.event_name }}" = pull_request ]; then
            options+=("-Dproto.compatibility.baseline=$GITHUB_WORKSPACE/baseline/shared/proto/target/generated-resources/protobuf/descriptor-sets/platform.protobin")
          fi
          bash mvnw --batch-mode --no-transfer-progress -pl shared/proto -am clean verify "${options[@]}"
      - name: Verify published SOAP contracts and producer/client schema parity
        shell: bash
        run: |
          options=()
          if [ "${{ github.event_name }}" = pull_request ]; then
            options+=(--base-root baseline)
          fi
          python scripts/check_soap_contracts.py "${options[@]}"
      - name: Regenerate and verify JAXB clients and the published SOAP boundary
        run: >-
          bash mvnw --batch-mode --no-transfer-progress
          -pl legacy-bank-service,legacy-banking-adapter -am clean verify
      - name: Publish generated contract and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contract-compatibility-reports
          path: |
            shared/proto/target/generated-resources/protobuf/descriptor-sets/**
            shared/proto/target/surefire-reports/**
            legacy-bank-service/target/surefire-reports/**
            legacy-banking-adapter/target/surefire-reports/**
          if-no-files-found: error

  coverage-regression:
    # Use pull_request (never pull_request_target): untrusted builds get no secrets
    # or write credentials. Both revisions run the same unit-only phase.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Cache the checksum-verified Maven distribution
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/wrapper/dists
          key: maven-wrapper-${{ runner.os }}-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test coverage comparison tooling
        run: python -m unittest discover -s scripts/tests -v
      - name: Rebuild and verify the pinned GraphQL security backport
        run: python3 scripts/bootstrap_graphql_backport.py
      - name: Measure clean head unit coverage
        if: github.event_name == 'pull_request'
        run: >-
          bash mvnw --batch-mode --no-transfer-progress clean
          org.jacoco:jacoco-maven-plugin:0.8.12:prepare-agent package
          org.jacoco:jacoco-maven-plugin:0.8.12:report
      - name: Snapshot head coverage
        if: github.event_name == 'pull_request'
        run: >-
          python scripts/check_coverage_regression.py snapshot --root .
          --revision "$GITHUB_SHA" --output coverage/head.json
      - name: Check out the exact PR base revision
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - name: Measure clean base unit coverage
        if: github.event_name == 'pull_request'
        working-directory: baseline
        run: >-
          bash mvnw --batch-mode --no-transfer-progress clean
          org.jacoco:jacoco-maven-plugin:0.8.12:prepare-agent package
          org.jacoco:jacoco-maven-plugin:0.8.12:report
      - name: Snapshot base with the same measurement policy
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          python scripts/check_coverage_regression.py snapshot --root baseline
          --revision "$BASE_SHA" --output coverage/base.json
      - name: Reject per-module coverage regression
        if: github.event_name == 'pull_request'
        run: >-
          python scripts/check_coverage_regression.py compare
          --base coverage/base.json --head coverage/head.json >> "$GITHUB_STEP_SUMMARY"
      - name: Publish comparison evidence
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-coverage-comparison
          path: coverage/*.json
          if-no-files-found: error

  dependency-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Cache the checksum-verified Maven distribution
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/wrapper/dists
          key: maven-wrapper-${{ runner.os }}-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Set vulnerability cache date
        id: cache-date
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-13-${{ runner.os }}-${{ steps.cache-date.outputs.day }}-${{ github.run_id }}
          restore-keys: nvd-13-${{ runner.os }}-
      - name: Rebuild and verify the pinned GraphQL security backport
        run: python3 scripts/bootstrap_graphql_backport.py
      - name: Resolve packaged reactor artifacts for aggregate analysis
        # Tests/coverage run in the independent required verify job.
        run: bash mvnw --batch-mode --no-transfer-progress clean install -DskipTests -DskipITs -Djacoco.skip=true
      - name: Verify executable jars and Docker layer extraction
        run: python3 scripts/check_packaging.py
      - name: Generate aggregate CycloneDX SBOM
        run: bash mvnw --batch-mode --no-transfer-progress -Psupply-chain cyclonedx:makeAggregateBom
      - name: Reject dependencies with CVSS 7 or higher
        run: bash mvnw --batch-mode --no-transfer-progress -Psupply-chain dependency-check:aggregate
      - name: Publish SBOM and dependency policy evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supply-chain-reports
          path: |
            target/bom.json
            target/bom.xml
            target/dependency-check-report.*
          if-no-files-found: error

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - product-service
          - customer-service
          - order-service
          - graphql-gateway
          - inventory-service
          - payment-service
          - notification-service
          - payment-provider-simulator
          - legacy-bank-service
          - legacy-banking-adapter
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Set immutable source timestamp
        id: source
        run: |
          echo "epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p "coverage/operations/release/${{ matrix.service }}"
      - name: Build service image from the reactor root
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: false
          outputs: type=docker,rewrite-timestamp=true
          provenance: false
          sbom: false
          build-args: SOURCE_DATE_EPOCH=${{ steps.source.outputs.epoch }}
          tags: omp/${{ matrix.service }}:verification
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Independently reproduce the representative application image
        if: matrix.service == 'product-service'
        env:
          SOURCE_EPOCH: ${{ steps.source.outputs.epoch }}
        run: >-
          docker buildx build --no-cache --provenance=false --sbom=false
          --output type=docker,rewrite-timestamp=true
          --build-arg SOURCE_DATE_EPOCH="$SOURCE_EPOCH"
          --file product-service/Dockerfile --tag omp/product-service:reproduced .
      - name: Scan the actual runtime image without unfixed-vulnerability exceptions
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          cache-dir: ${{ runner.temp }}/omp-trivy-cache
          image-ref: omp/${{ matrix.service }}:verification
          format: json
          output: coverage/operations/release/${{ matrix.service }}/scan.json
          exit-code: '1'
          severity: HIGH,CRITICAL
          scanners: vuln
          ignore-unfixed: false
      - name: Inventory actual runtime components
        env:
          SERVICE: ${{ matrix.service }}
        run: trivy image --scanners vuln --format cyclonedx --output "coverage/operations/release/$SERVICE/sbom.json" "omp/$SERVICE:verification"
      - name: Install the signing tool from its reviewed image digest
        run: python scripts/install_cosign.py --directory "$RUNNER_TEMP/omp-cosign"
      - name: Verify keyless signing and deny tampering or foreign identities
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          comparison=()
          if [ "$SERVICE" = product-service ]; then comparison=(--comparison omp/product-service:reproduced); fi
          python scripts/verify_release_rehearsal.py --image "omp/$SERVICE:verification" "${comparison[@]}" --output "coverage/operations/release/$SERVICE"
      - name: Retain scanning signing and reproduction evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-security-${{ matrix.service }}
          path: coverage/operations/release/**
          if-no-files-found: error

  workload-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify imported recovery identity and atomic token rotation
        run: python scripts/verify_recovery_identity.py --report coverage/recovery-identity-issuer.json
      - name: Retain issuer verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workload-identity-reports
          path: coverage/recovery-identity-issuer.json
          if-no-files-found: error

  events-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_PROJECT_NAME: omp-events-acceptance-${{ github.run_id }}
      E2E_EVENTS_CONTROLS: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Cache the checksum-verified Maven distribution
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/wrapper/dists
          key: maven-wrapper-${{ runner.os }}-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: clients/notifications/package-lock.json
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Prepare isolated development trust and routing
        run: |
          bash scripts/ci-setup.sh
          for service in order-service inventory-service payment-service; do
            sudo chgrp 1000 "infrastructure/tls/$service/tls.key"
            chmod 640 "infrastructure/tls/$service/tls.key"
          done
          echo '127.0.0.1 keycloak.localhost product-service.localhost customer-service.localhost order-service.localhost notification.localhost' | sudo tee -a /etc/hosts
      - name: Build independently packaged event producers and notification replicas
        run: |
          for service in product-service customer-service order-service inventory-service payment-service notification-service; do
            docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.e2e.yml -f docker-compose.events-e2e.yml build "$service"
          done
      - name: Start the disposable two-replica stack
        run: >-
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.e2e.yml -f docker-compose.events-e2e.yml
          up -d --no-build --wait --wait-timeout 600 traefik product-service customer-service order-service
          inventory-service payment-service notification-service notification-service-2
      - name: Measure durability security and declared realtime delivery objectives
        working-directory: clients/notifications
        run: |
          npm ci --ignore-scripts
          npm run build
          node test/realtime-load.mjs
      - name: Reject missing or incomplete load acceptance evidence
        run: |
          python scripts/check_junit.py coverage/events-acceptance/realtime-load.xml --minimum-tests 9
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('coverage/events-acceptance/realtime-load.json').read_text())
          assert report['passed'] and report['unauthorizedDeliveries']==0
          assert len(report['phases'])==9 and all(p['passed'] for p in report['phases'])
          PY
      - name: Collect isolated deployment diagnostics
        if: always()
        run: |
          mkdir -p coverage/events-acceptance
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.e2e.yml -f docker-compose.events-e2e.yml ps -a > coverage/events-acceptance/containers.txt
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.e2e.yml -f docker-compose.events-e2e.yml logs --no-color --tail 200 > coverage/events-acceptance/services.log
      - name: Publish measured event and realtime acceptance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: events-realtime-acceptance
          path: coverage/events-acceptance
          if-no-files-found: error
      - name: Remove only this disposable stack and volumes
        if: always()
        run: >-
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.e2e.yml -f docker-compose.events-e2e.yml
          down -v --remove-orphans

  payments-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: omp-payments-acceptance-${{ github.run_id }}
      KEYCLOAK_URL: http://127.0.0.1:18089
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned acceptance-client dependencies
        run: python -m pip install -r scripts/contracts-requirements.lock
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Prepare isolated development trust
        run: |
          bash scripts/ci-setup.sh
          sudo chgrp 1000 infrastructure/tls/payment-service/tls.key
          chmod 640 infrastructure/tls/payment-service/tls.key
      - name: Build the independently packaged payment pipeline
        run: |
          for service in payment-service notification-service payment-provider-simulator; do
            docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.e2e.yml -f docker-compose.payments-e2e.yml build "$service"
          done
      - name: Start the disposable provider and webhook topology
        run: >-
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.e2e.yml -f docker-compose.payments-e2e.yml
          up -d --no-build --wait --wait-timeout 600 payment-provider-simulator payment-service notification-service
      - name: Verify payment lifecycle and webhook security load and recovery
        run: python scripts/verify_payment_webhooks.py --project "$COMPOSE_PROJECT_NAME"
      - name: Reject missing or incomplete payment acceptance evidence
        run: |
          python scripts/check_junit.py coverage/payment-webhooks/payment-webhooks.xml --minimum-tests 7
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads(Path('coverage/payment-webhooks/payment-webhooks.json').read_text())
          assert report['passed'] and len(report['phases'])==7 and all(p['passed'] for p in report['phases'])
          assert report['cleanupPassed'] and not report['sourceDirty']
          assert report['sourceRevision']==os.environ['GITHUB_SHA']
          PY
      - name: Retain payment pipeline diagnostics
        if: always()
        run: |
          mkdir -p coverage/payment-webhooks
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.e2e.yml -f docker-compose.payments-e2e.yml ps -a > coverage/payment-webhooks/containers.txt
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.e2e.yml -f docker-compose.payments-e2e.yml logs --no-color --tail 200 > coverage/payment-webhooks/services.log
      - name: Publish source-bound payment acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: payment-webhook-acceptance
          path: coverage/payment-webhooks/**
          if-no-files-found: error
      - name: Remove only this run's disposable payment topology
        if: always()
        run: >-
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.e2e.yml -f docker-compose.payments-e2e.yml
          down --volumes --remove-orphans

  soap-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE_PROJECT_NAME: omp-soap-acceptance-${{ github.run_id }}
      KEYCLOAK_URL: http://127.0.0.1:18089
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Cache the checksum-verified Maven distribution
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/wrapper/dists
          key: maven-wrapper-${{ runner.os }}-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned acceptance client dependencies
        run: python -m pip install -r scripts/contracts-requirements.lock
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Prepare separate disposable banking secrets and trusted certificates
        run: bash scripts/setup-soap-acceptance.sh
      - name: Build both SOAP processes from clean source
        run: |
          for service in legacy-bank-service legacy-banking-adapter; do
            docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.e2e.yml -f docker-compose.soap-e2e.yml build --build-arg VCS_REF="$GITHUB_SHA" "$service"
          done
      - name: Start fresh banking ledger issuer ingress and facade
        run: >-
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.e2e.yml -f docker-compose.soap-e2e.yml
          up -d --no-build --wait --wait-timeout 600 traefik legacy-banking-adapter
      - name: Execute security rotation durable transfers and bounded resilience
        run: python scripts/verify_soap_boundary.py --project "$COMPOSE_PROJECT_NAME"
      - name: Reject incomplete or unbound SOAP acceptance evidence
        run: |
          python scripts/check_junit.py coverage/soap-acceptance/soap-acceptance.xml --minimum-tests 7
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads(Path('coverage/soap-acceptance/soap-acceptance.json').read_text())
          assert report['passed'] and report['cleanupPassed'] and not report['sourceDirty']
          assert report['sourceRevision']==os.environ['GITHUB_SHA']
          assert len(report['phases'])==7 and all(p['passed'] for p in report['phases'])
          assert all(image['revision']==report['sourceRevision'] for image in report['runtime'].values())
          PY
      - name: Retain redacted diagnostics
        if: always()
        run: python scripts/collect_soap_diagnostics.py --project "$COMPOSE_PROJECT_NAME"
      - name: Retain source-bound SOAP evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: soap-boundary-acceptance
          path: coverage/soap-acceptance/**
          if-no-files-found: error
      - name: Remove only this disposable topology
        if: always()
        run: >-
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.e2e.yml -f docker-compose.soap-e2e.yml
          down --volumes --remove-orphans

  operations-core:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check the production inventory and OWASP review
        run: |
          python scripts/check_production_configuration.py
          python scripts/check_security_inventory.py
      - name: Build the pinned backup-capable PostgreSQL image
        run: docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -t omp/postgres:section7-recovery infrastructure/postgres
      - name: Execute alert delivery and bounded tracing
        run: python scripts/verify_operations_monitoring.py --project "omp-operations-mon${{ github.run_id }}"
      - name: Execute broker and quota authentication ACLs and durable restart
        run: sudo "$(command -v python)" scripts/verify_secure_runtime.py --project "omp-operations-auth${{ github.run_id }}"
      - name: Execute encrypted backup and isolated point-in-time restore
        run: python scripts/verify_postgres_recovery.py --project "omp-operations-pitr${{ github.run_id }}"
      - name: Require complete source-bound evidence and successful cleanup
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          for name,count in (("monitoring",5),("secure-runtime",6),("postgres-recovery",4)):
              report=json.loads(Path("coverage/operations",name+".json").read_text())
              assert report["passed"] and report["cleanupPassed"] and not report["sourceDirty"]
              assert report["sourceRevision"]==os.environ["GITHUB_SHA"] and len(report["sourceTreeSha256"])==64
              assert len(report["phases"])==count and all(p["passed"] for p in report["phases"])
          PY
      - name: Retain operational measurements and redacted diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: operations-core-acceptance
          path: coverage/operations/**
          if-no-files-found: error

  operations-api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Bind both production-profile images to the exact source tree
        shell: bash
        run: |
          set -euo pipefail
          tree=$(python -c 'import pathlib,sys; sys.path.insert(0,"scripts"); from operations.evidence import evidence; print(evidence("docker",pathlib.Path.cwd())["sourceTreeSha256"])')
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" --label "com.omp.source-tree=$tree" -f product-service/Dockerfile -t omp/product-service:operations-acceptance .
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" --label "com.omp.source-tree=$tree" -t omp/postgres:section7-recovery infrastructure/postgres
      - name: Exercise issuer audience metrics authorization shared quotas and store outage
        run: sudo "$(command -v python)" scripts/verify_production_api.py --project "omp-operations-api${{ github.run_id }}"
      - name: Require all real production-profile phases and cleanup
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          report=json.loads(Path("coverage/operations/production-api.json").read_text())
          assert report["passed"] and report["cleanupPassed"] and not report["sourceDirty"]
          assert report["sourceRevision"]==os.environ["GITHUB_SHA"] and len(report["sourceTreeSha256"])==64
          assert len(report["ownedImages"])==2 and len(report["phases"])==3 and all(p["passed"] for p in report["phases"])
          PY
      - name: Retain redacted API acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: operations-api-acceptance
          path: coverage/operations/**
          if-no-files-found: error

  operations-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: omp-operations-journey${{ github.run_id }}
      OMP_ACCEPTANCE_FIXTURES: 'true'
    steps:
      - name: Define isolated recovery projection paths
        run: |
          printf 'ORDER_RECOVERY_TOKEN_DIRECTORY=%s/operations-recovery/projection\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'ORDER_RECOVERY_CLIENT_SECRET_FILE=%s/operations-recovery/client-secret\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: clients/notifications/package-lock.json
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Verify bounded logical callers independently of k6 worker reuse
        run: node --test scripts/performance/identities.test.mjs
      - name: Prepare private development trust for the disposable journey
        run: |
          bash scripts/ci-setup.sh
          for service in order-service inventory-service payment-service; do
            sudo chgrp 1000 "infrastructure/tls/$service/tls.key"
            chmod 640 "infrastructure/tls/$service/tls.key"
          done
      - name: Provision private development recovery identity for application UID 1000
        shell: bash
        run: |
          sudo --preserve-env=ORDER_RECOVERY_TOKEN_DIRECTORY,ORDER_RECOVERY_CLIENT_SECRET_FILE "$(command -v python)" - <<'PY'
          import json, os
          from pathlib import Path
          projection = Path(os.environ['ORDER_RECOVERY_TOKEN_DIRECTORY'])
          secret = Path(os.environ['ORDER_RECOVERY_CLIENT_SECRET_FILE'])
          assert projection.is_absolute() and secret.parent == projection.parent
          projection.parent.mkdir(mode=0o700)
          projection.mkdir(mode=0o700)
          realm = json.loads(Path('infrastructure/keycloak/import/omp-realm.json').read_text())
          credential = next(c['secret'] for c in realm['clients'] if c['clientId'] == 'order-recovery')
          with secret.open('x', encoding='utf-8') as target:
              os.fchmod(target.fileno(), 0o400)
              target.write(credential)
              os.fchown(target.fileno(), 1000, 1000)
          for path in (projection.parent, projection):
              os.chown(path, 1000, 1000)
          PY
      - name: Build source-bound protocol participants
        run: |
          for service in product-service customer-service order-service inventory-service payment-service notification-service graphql-gateway; do
            docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -f "$service/Dockerfile" -t "omp/$service:1.0.0-SNAPSHOT" .
          done
      - name: Start the isolated protocol and telemetry topology
        id: operations-stack
        run: >-
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.e2e.yml -f docker-compose.lifecycle.yml -f docker-compose.recovery-projector.yml -f docker-compose.operations-journey.yml
          up -d --no-build --wait --wait-timeout 600 traefik product-service customer-service order-service inventory-service payment-service notification-service graphql-gateway tempo
      - name: Trace a real checkout through every applicable asynchronous boundary
        working-directory: clients/notifications
        run: |
          npm ci --ignore-scripts
          node test/operations-journey.mjs
      - name: Measure and recover a failing downstream HTTP dependency
        if: always() && steps.operations-stack.outcome == 'success'
        run: python scripts/verify_downstream_http_fault.py --project "$COMPOSE_PROJECT_NAME"
      - name: Rehearse failed application replacement and immutable rollback
        if: always() && steps.operations-stack.outcome == 'success'
        run: python scripts/verify_deployment_rollback.py --project "$COMPOSE_PROJECT_NAME"
      - name: Prepare isolated workload clients and captured noop payments
        id: load-fixtures
        if: always() && steps.operations-stack.outcome == 'success'
        run: python scripts/prepare_performance_fixtures.py --project "$COMPOSE_PROJECT_NAME" --directory "$RUNNER_TEMP/operations-load-fixtures"
      - name: Measure the declared k6 load and ten-minute soak with conservation checks
        if: always() && steps.load-fixtures.outcome == 'success'
        run: >-
          python scripts/verify_operations_performance.py --project "$COMPOSE_PROJECT_NAME"
          --identities "$RUNNER_TEMP/operations-load-fixtures/identities.json"
          --load-data "$RUNNER_TEMP/operations-load-fixtures/load.json"
          --soak-data "$RUNNER_TEMP/operations-load-fixtures/soak.json"
      - name: Require the complete trace exemplar logs and cleanup evidence
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          report=json.loads(Path("coverage/operations/protocol-journey.json").read_text())
          assert report["passed"] and report["cleanupPassed"] and not report["sourceDirty"]
          assert report["sourceRevision"]==os.environ["GITHUB_SHA"] and len(report["sourceTreeSha256"])==64
          assert len(report["ownedImages"])==7 and len(report["phases"])==3 and all(p["passed"] for p in report["phases"])
          fault=json.loads(Path("coverage/operations/downstream-http.json").read_text())
          assert fault["passed"] and fault["cleanupPassed"] and not fault["sourceDirty"] and fault["sourceRevision"]==os.environ["GITHUB_SHA"]
          rollback=json.loads(Path("coverage/operations/deployment-rollback.json").read_text())
          assert rollback["passed"] and rollback["cleanupPassed"] and not rollback["sourceDirty"] and rollback["sourceRevision"]==os.environ["GITHUB_SHA"]
          performance=json.loads(Path("coverage/operations/performance/performance.json").read_text())
          assert performance["passed"] and not performance["sourceDirty"] and performance["sourceRevision"]==os.environ["GITHUB_SHA"]
          assert len(performance["phases"])==2 and all(p["passed"] and p["conservationPassed"] for p in performance["phases"])
          PY
      - name: Retain isolated deployment diagnostics
        if: always()
        run: |
          mkdir -p coverage/operations
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.e2e.yml -f docker-compose.lifecycle.yml -f docker-compose.recovery-projector.yml -f docker-compose.operations-journey.yml ps -a > coverage/operations/protocol-containers.txt
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.e2e.yml -f docker-compose.lifecycle.yml -f docker-compose.recovery-projector.yml -f docker-compose.operations-journey.yml logs --no-color --tail 120 > coverage/operations/protocol-services.log
      - name: Retain source-bound protocol journey evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: operations-protocol-journey
          path: coverage/operations/**
          if-no-files-found: error
      - name: Remove only the disposable journey topology
        if: always()
        run: >-
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.e2e.yml -f docker-compose.lifecycle.yml -f docker-compose.recovery-projector.yml -f docker-compose.operations-journey.yml
          down --volumes --remove-orphans

  quality-gate:
    if: always()
    needs: [verify, packaged-payment-journey, external-e2e, public-api-e2e, grpc-e2e, events-e2e, payments-e2e, soap-e2e, notification-client, static-analysis, contract-compatibility, coverage-regression, dependency-policy, images, workload-identity, operations-core, operations-api, operations-journey]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification job to succeed
        env:
          TEST_RESULT: ${{ needs.verify.result }}
          JOURNEY_RESULT: ${{ needs['packaged-payment-journey'].result }}
          EXTERNAL_RESULT: ${{ needs['external-e2e'].result }}
          EVENTS_RESULT: ${{ needs['events-e2e'].result }}
          PAYMENTS_RESULT: ${{ needs['payments-e2e'].result }}
          SOAP_RESULT: ${{ needs['soap-e2e'].result }}
          GRPC_RESULT: ${{ needs['grpc-e2e'].result }}
          PUBLIC_API_RESULT: ${{ needs['public-api-e2e'].result }}
          CLIENT_RESULT: ${{ needs['notification-client'].result }}
          STATIC_RESULT: ${{ needs['static-analysis'].result }}
          CONTRACT_RESULT: ${{ needs['contract-compatibility'].result }}
          COVERAGE_RESULT: ${{ needs['coverage-regression'].result }}
          DEPENDENCY_RESULT: ${{ needs['dependency-policy'].result }}
          IMAGE_RESULT: ${{ needs.images.result }}
          OPERATIONS_RESULT: ${{ needs['operations-core'].result }}
          OPERATIONS_API_RESULT: ${{ needs['operations-api'].result }}
          OPERATIONS_JOURNEY_RESULT: ${{ needs['operations-journey'].result }}
          IDENTITY_RESULT: ${{ needs['workload-identity'].result }}
        run: |
          for result in "$TEST_RESULT" "$JOURNEY_RESULT" "$EXTERNAL_RESULT" "$PUBLIC_API_RESULT" "$GRPC_RESULT" "$EVENTS_RESULT" "$PAYMENTS_RESULT" "$SOAP_RESULT" "$CLIENT_RESULT" "$STATIC_RESULT" "$CONTRACT_RESULT" "$COVERAGE_RESULT" "$DEPENDENCY_RESULT" "$IMAGE_RESULT" "$IDENTITY_RESULT" "$OPERATIONS_RESULT" "$OPERATIONS_API_RESULT" "$OPERATIONS_JOURNEY_RESULT"; do
            if [ "$result" != success ]; then
              echo "A required verification job failed, was cancelled, or was skipped."
              exit 1
            fi
          done
