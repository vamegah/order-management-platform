# ==============================================================================
# Inventory Service — base configuration
# ==============================================================================
# This service differs from Phase 1's REST services in two ways:
#   1. Business operations use gRPC on port 9091.
#   2. Only management endpoints have an HTTP listener (9092).
#
# Everything else (JPA, Flyway, security, OTel) follows the same patterns.
# ==============================================================================

spring:
  http:
    converters:
      preferred-json-mapper: jackson2
  application:
    name: inventory-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # ----------------------------------------------------------------------------
  # Datasource — the `inventory` schema
  # ----------------------------------------------------------------------------
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/omp?currentSchema=inventory,public}
    username: ${SPRING_DATASOURCE_USERNAME:inventory_svc}
    password: ${SPRING_DATASOURCE_PASSWORD:local-dev-inventory-password}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Smaller pool than REST services: inventory RPCs are fast and
      # mostly queries. 8 connections is generous for Phase 3.
      maximum-pool-size: 8
      minimum-idle: 2
      keepalive-time: 300000
      connection-timeout: 5000
      validation-timeout: 3000
      pool-name: inventory-service-hikari

  # ----------------------------------------------------------------------------
  # JPA / Hibernate
  # ----------------------------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.batch_size: 25
        order_inserts: true
        order_updates: true
        format_sql: false
    open-in-view: false

  # ----------------------------------------------------------------------------
  # Flyway
  # ----------------------------------------------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

  # ----------------------------------------------------------------------------
  # OAuth2 / JWT
  # ----------------------------------------------------------------------------
  # The resource-server starter provides the JwtDecoder bean. The gRPC
  # interceptor uses it to validate tokens from gRPC metadata.
  # ----------------------------------------------------------------------------
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://keycloak.localhost/realms/omp}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://keycloak:8080/realms/omp/protocol/openid-connect/certs}

# Disable the application HTTP connector; the separate management listener below
# uses the servlet infrastructure without exposing a second public HTTP port.
server:
  port: -1

# ==============================================================================
# gRPC server
# ==============================================================================
# Configured via grpc-spring-boot-starter.
#
# PORT 9091: the gRPC server. Reachable by other services on the app network.
# REFLECTION: enabled in dev so `grpcurl` can list services. Disabled in prod.
# ==============================================================================
grpc:
  server:
    port: ${GRPC_PORT:9091}
    enable-reflection: ${GRPC_REFLECTION_ENABLED:true}
    security:
      enabled: ${GRPC_MTLS_ENABLED:true}
      certificate-chain: file:${TLS_CERT_PATH:/etc/tls/tls.crt}
      private-key: file:${TLS_KEY_PATH:/etc/tls/tls.key}
      trust-cert-collection: file:${TLS_CA_PATH:/etc/tls/ca.crt}
      client-auth: REQUIRE
    # The server will register any bean annotated with @GrpcService.

    # Max inbound message size. Default is 4 MB. Inventory messages are tiny
    # (a few hundred bytes); leave default.

    # Keepalive: how the server probes clients to detect dead connections.
    # Defaults are fine for Phase 3.

# ==============================================================================
# Management HTTP (actuator)
# ==============================================================================
# Runs on a separate HTTP server (Spring Boot's "management port"). This
# server is NOT the same as a Tomcat; it's a lightweight embedded HTTP
# server started specifically for actuator endpoints.
# ==============================================================================
management:
  server:
    port: ${MANAGEMENT_PORT:9092}
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      env: ${PROMETHEUS_ENV:dev}

# ==============================================================================
# OpenTelemetry tracing
# ==============================================================================
# Same as Phase 1. gRPC calls are automatically traced by grpc-spring-boot-
# starter's Micrometer integration. The traceparent header is propagated
# via gRPC metadata.
# ==============================================================================
management.tracing:
  sampling:
    probability: ${TRACING_SAMPLE_RATE:1.0}
  propagation:
    type: w3c

otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4317}
      protocol: grpc
  resource:
    attributes:
      service.name: ${spring.application.name}
      service.namespace: omp
      deployment.environment: ${PROMETHEUS_ENV:dev}

# ==============================================================================
# Logging
# ==============================================================================
logging:
  level:
    root: INFO
    com.example.omp: INFO
    net.devh.boot.grpc: INFO
    io.grpc: INFO
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"
